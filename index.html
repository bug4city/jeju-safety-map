<style>
:root {
  /* 미니 디자인 토큰 — 색은 여기서만 정의한다 */
  --ink:#1c1c1e; --sub:#6e6e73; --card:#ffffff; --line:#ececf0;
  --accent:#c0392b;            /* 사건(빨강) — 데이터 의미 전용 */
  --brand:#00a05a;             /* 안전=초록. 인터랙션·선택·링크 전용, 데이터 색과 안 겹침 */
  --brand-soft:#e6f6ee;
  --panel-muted:#f7f8fa;
  --blue:#1f7ae0;
  --blue-soft:#eaf3ff;
  --cctv:#008a9a;
  --cctv-soft:#e6f7f9;
  --line-strong:#d1d1d6;
  --chip-dark:#111827; --chip-dark-hover:#1f2937;   /* 헤더 다크 필 버튼 전용 */
  --placeholder:#8a8f98;
  --focus-brand:rgba(0,160,90,.13); --focus-blue:rgba(31,122,224,.22);
  --r-xs:6px; --r-sm:10px; --r-lg:16px;
  --shadow-1:0 1px 6px rgba(0,0,0,.1);
  --shadow-2:0 4px 20px rgba(0,0,0,.14);
  --fs-title:17px; --fs-md:15px; --fs-body:14px; --fs-ui:13.5px; --fs-sub:12.5px; --fs-cap:11px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;  /* 간격은 이 4단계만 쓴다 */
  --panel-w:360px; --sheet-peek:112px; --sheet-half:46vh; --header-h:56px;
}
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:var(--ink); overflow:hidden; }
#map { position:fixed; inset:0; }

/* 앱 헤더: 외부 피드백/프로필 링크 */
.app-header {
  position:fixed; top:0; left:0; right:0; z-index:1300;
  width:100vw;
  height:calc(var(--header-h) + env(safe-area-inset-top)); padding:env(safe-area-inset-top) var(--sp-3) 0;
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
  background:rgba(247,248,250,.96); border-bottom:1px solid var(--line); backdrop-filter:saturate(180%) blur(14px);
}
.header-brand {
  min-width:0; display:flex; align-items:center; gap:var(--sp-2); color:var(--ink); text-decoration:none;
  font-size:var(--fs-md); font-weight:800; letter-spacing:0;
}
.header-brand img { flex:none; width:32px; height:32px; border-radius:8px; box-shadow:var(--shadow-1); }
.header-actions { display:flex; align-items:center; gap:var(--sp-2); flex:none; }
.header-action {
  min-height:34px; border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:0 var(--sp-3);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  background:var(--chip-dark); color:#fff; text-decoration:none; font-size:var(--fs-ui); font-weight:700;
  box-shadow:var(--shadow-1); white-space:nowrap;
}
.header-action svg { flex:none; width:16px; height:16px; }
.header-action:hover, .header-action:focus-visible, .header-brand:focus-visible {
  outline:3px solid var(--focus-blue); outline-offset:2px;
}
.header-action:hover { background:var(--chip-dark-hover); }
.header-action.icon-only { width:34px; padding:0; }
.header-grid { display:grid; grid-template-columns:repeat(3,3px); gap:3px; }
.header-grid i { width:3px; height:3px; border-radius:50%; background:currentColor; }

/* ── 패널: 모바일은 바텀시트, 데스크톱은 좌측 고정 ── */
.panel {
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:var(--card); border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.14);
  height:85vh; transform:translateY(calc(100% - var(--sheet-peek)));
  transition:transform .28s cubic-bezier(.3,.9,.3,1);
  display:flex; flex-direction:column;
}
.panel.half { transform:translateY(calc(100% - var(--sheet-half))); }
.panel.full { transform:translateY(calc(8px + env(safe-area-inset-top))); }
.grab { padding:var(--sp-2) 0 var(--sp-1); cursor:grab; flex:none; }
.grab::before { content:''; display:block; width:44px; height:5px; border-radius:3px; background:var(--line-strong); margin:0 auto; }
.panel-head { padding:var(--sp-1) var(--sp-4) var(--sp-2); flex:none; }
.panel-head h1 { font-size:var(--fs-title); }
.panel-head p { font-size:var(--fs-sub); color:var(--sub); margin-top:var(--sp-1); line-height:1.5; word-break:keep-all; overflow-wrap:break-word; }
.panel-head strong { color:var(--accent); }
.tabs { display:flex; gap:var(--sp-2); padding:0 var(--sp-4) var(--sp-2); flex:none; }
.tab { flex:1; font-size:var(--fs-ui); padding:var(--sp-2) 0; border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:var(--r-sm); cursor:pointer; }
.tab.on { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600; }
.panel-tools { flex:none; padding:0 var(--sp-4) var(--sp-3); border-bottom:1px solid var(--line); }
.search-box {
  display:flex; align-items:center; gap:var(--sp-2); min-height:48px; padding:0 var(--sp-3);
  border:1px solid var(--line-strong); border-radius:var(--r-sm); background:#fff; box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.search-box:focus-within { border-color:var(--brand); box-shadow:0 0 0 3px var(--focus-brand); }
.search-box svg { flex:none; width:20px; height:20px; color:var(--sub); }
.search-box input { flex:1; min-width:0; border:0; outline:0; font-size:var(--fs-md); color:var(--ink); background:transparent; }
.search-box input::placeholder { color:var(--placeholder); }
.search-box input::-webkit-search-cancel-button { appearance:none; display:none; }
.icon-btn {
  flex:none; width:30px; height:30px; border:0; border-radius:999px; background:transparent; color:var(--sub);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn:hover, .icon-btn:focus-visible { background:var(--panel-muted); color:var(--ink); outline:none; }
.icon-btn[hidden] { display:none; }
.icon-btn svg { width:18px; height:18px; }
.panel-actions { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); margin-top:var(--sp-2); }
.tool-btn {
  min-height:42px; border:1px solid var(--line); border-radius:var(--r-sm); background:#fff; color:var(--ink);
  font-size:var(--fs-ui); font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
}
.tool-btn svg { width:17px; height:17px; color:var(--sub); }
.tool-btn:hover, .tool-btn:focus-visible { border-color:var(--line-strong); background:var(--panel-muted); outline:none; }
.tool-btn.locating { color:var(--blue); border-color:var(--blue); background:var(--blue-soft); }
.tool-btn.searching { color:var(--brand); border-color:var(--brand); background:var(--brand-soft); }
.result-meta { display:flex; justify-content:space-between; gap:var(--sp-2); margin-top:var(--sp-3); color:var(--sub); font-size:var(--fs-sub); line-height:1.4; }
.result-meta b { color:var(--ink); font-weight:700; }
.panel-body { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:0 var(--sp-4) calc(var(--sp-4) + var(--sp-1) + env(safe-area-inset-bottom)); }

.item { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-2); margin:0 calc(var(--sp-2) * -1); border-bottom:1px solid var(--line); cursor:pointer; border-radius:var(--r-sm); }
.item:hover, .item:focus-visible { background:var(--panel-muted); outline:none; }
.item.selected { background:var(--brand-soft); }
.item .dot { flex:none; width:12px; height:12px; border-radius:50%; }
.item .t { flex:1; min-width:0; }
.item .t b { display:block; font-size:var(--fs-body); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .t span { font-size:var(--fs-sub); color:var(--sub); }
.item .distance { display:block; color:var(--blue); font-size:var(--fs-sub); font-weight:700; margin-top:2px; }
.item .badge { flex:none; font-size:var(--fs-cap); font-weight:700; border-radius:var(--r-xs); padding:3px var(--sp-2); color:#fff; }
.item .metrics { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
.metric-pill {
  display:inline-flex; align-items:center; min-height:20px; border:1px solid var(--line); border-radius:999px;
  padding:0 var(--sp-2); background:#fff; color:var(--sub); font-size:var(--fs-cap); font-weight:700;
}
.metric-pill.alert { border-color:rgba(192,57,43,.32); color:var(--accent); background:#fff5f4; }
.bar-wrap { flex:none; width:74px; }
.bar-wrap small { display:block; font-size:var(--fs-cap); color:var(--sub); text-align:right; margin-bottom:3px; }
.bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; }

/* 상세 뷰 */
.detail { display:none; padding:var(--sp-1) 0 calc(var(--sp-4) + var(--sp-1)); }
.detail.on { display:block; }
.list-view.off { display:none; }
.back { border:0; background:none; color:var(--brand); font-size:var(--fs-body); padding:var(--sp-2) 0 var(--sp-3); cursor:pointer; }
.detail .status { display:inline-block; font-size:var(--fs-sub); font-weight:700; color:#fff; background:var(--accent); border-radius:var(--r-xs); padding:2px var(--sp-2); margin-bottom:var(--sp-2); }
.detail h2 { font-size:var(--fs-title); margin-bottom:2px; }
.detail .area { font-size:var(--fs-ui); color:var(--sub); margin-bottom:var(--sp-2); }
.detail .summary { font-size:var(--fs-body); line-height:1.65; margin-bottom:var(--sp-3); }
.detail .src { font-size:var(--fs-ui); }
.detail .src a { color:var(--brand); text-decoration:none; margin-right:var(--sp-3); }

/* 지도 위 요소 */
.chips { position:fixed; top:calc(var(--header-h) + var(--sp-3) + env(safe-area-inset-top)); left:var(--sp-3); right:var(--sp-3); z-index:1000; display:flex; gap:var(--sp-2); overflow-x:auto; scrollbar-width:none; }
.chip { flex:none; font-size:var(--fs-ui); border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:999px; padding:var(--sp-2) var(--sp-3); cursor:pointer; box-shadow:var(--shadow-1); }
.chip.on { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600; }
.chip[hidden] { display:none; }
.legend-stack {
  position:fixed; right:var(--sp-3); bottom:calc(var(--sheet-peek) + var(--sp-3)); z-index:900;
  display:flex; flex-direction:column; align-items:flex-end; gap:var(--sp-2); width:min(280px, calc(100vw - var(--sp-3) * 2));
}
.legend {
  width:100%; max-width:100%;
  background:rgba(255,255,255,.93); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); font-size:var(--fs-cap);
  box-shadow:var(--shadow-1); line-height:1.7;
}
/* 범례는 첫 방문 때 데이터 의미를 바로 알 수 있도록 기본 펼침 */
.legend-stack:not(.open) .legend { display:none; }
.legend-toggle {
  flex:none; font-size:var(--fs-cap); border:1px solid var(--line); background:rgba(255,255,255,.93);
  color:var(--sub); border-radius:999px; padding:var(--sp-1) var(--sp-3); cursor:pointer; box-shadow:var(--shadow-1);
}
.legend-stack.open .legend-toggle { background:var(--ink); border-color:var(--ink); color:#fff; }
.legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:var(--sp-2); }
.legend[hidden] { display:none; }
.legend .legend-title { font-size:var(--fs-cap); }
.legend .legend-title small { font-weight:400; color:var(--sub); }
.legend .scale-row { display:flex; align-items:center; gap:var(--sp-1); margin:var(--sp-1) 0 2px; min-width:0; }
.legend .scale-row span { font-size:var(--fs-cap); }
.legend .scale-bar { flex:1 1 56px; height:8px; border-radius:4px; min-width:56px; }
/* 데이터 그라데이션 — JS 팔레트(popStyle/CRIME)와 동기화. design.md 참고 */
.legend .scale-crime { background:linear-gradient(to right,#ffe27a,#f5a623,#e2573b,#b81d13); }
.legend .scale-pop { background:linear-gradient(to right,#d35400,#f0a35e,#d9d4c5,#7fa8d9,#2a5ca8); }
.legend .sub-note { font-size:var(--fs-cap); color:var(--sub); line-height:1.4; margin-top:2px; }
.cctv-dot {
  display:flex; align-items:center; justify-content:center; width:18px; height:18px;
  border:2px solid #fff; border-radius:50%; background:var(--cctv); color:#fff;
  box-shadow:0 1px 6px rgba(0,0,0,.35); font-size:9px; font-weight:800; cursor:pointer;
}
.cctv-dot.count { width:auto; min-width:28px; padding:0 var(--sp-1); border-radius:999px; }
.help-marker {
  display:flex; align-items:center; justify-content:center; min-width:42px; height:28px; padding:0 var(--sp-2);
  border:2px solid #fff; border-radius:999px; color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.28);
  font-size:var(--fs-cap); font-weight:900; white-space:nowrap; cursor:pointer;
}
.help-marker.police { background:var(--blue); }
.help-marker.hospital { background:var(--brand); }

/* 레이어를 처음 켰을 때 한 번만 띄우는 안내 */
.toast {
  position:fixed; left:50%; transform:translateX(-50%) translateY(-8px);
  top:calc(var(--header-h) + 56px + env(safe-area-inset-top)); z-index:1200;
  max-width:min(88vw, 420px); background:rgba(28,28,30,.92); color:#fff;
  border-radius:var(--r-sm); padding:var(--sp-3) var(--sp-4); font-size:var(--fs-sub); line-height:1.55;
  box-shadow:var(--shadow-2); opacity:0; transition:opacity .3s, transform .3s; pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast[hidden] { display:none; }

.pin-dot { display:block; width:18px; height:18px; background:var(--accent); border:2px solid #fff; border-radius:50%; box-shadow:0 1px 6px rgba(0,0,0,.4); cursor:pointer; }
.incident-marker {
  appearance:none; border:0; background:transparent; padding:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; filter:drop-shadow(0 3px 9px rgba(0,0,0,.24));
}
.incident-marker .label {
  min-width:128px; min-height:52px; display:flex; align-items:center; gap:var(--sp-2);
  padding:7px 13px 7px 8px; border:2px solid #a91419; border-radius:999px;
  background:rgba(255,255,255,.96); color:var(--ink); white-space:nowrap;
}
.incident-marker .icon {
  flex:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg,#d8392e,#93070c); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.incident-marker .icon svg { width:20px; height:20px; }
.incident-marker .text { min-width:0; display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
.incident-marker .primary { font-size:var(--fs-md); font-weight:900; letter-spacing:0; color:#17191f; }
.incident-marker .secondary { margin-top:4px; font-size:var(--fs-sub); font-weight:700; color:var(--sub); }
.incident-marker .anchor {
  width:16px; height:16px; margin-top:-2px; border-radius:50%; background:var(--accent);
  border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.34);
}
.incident-marker:focus-visible .label { outline:3px solid var(--focus-blue); outline-offset:2px; }

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
function haversineKm(a, b) {
  const R = 6371, d = Math.PI / 180;
  const x = Math.sin((b.lat - a.lat) * d / 2) ** 2 +
    Math.cos(a.lat * d) * Math.cos(b.lat * d) * Math.sin((b.lng - a.lng) * d / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmt(n) { return n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '만' : n.toLocaleString(); }
function norm(s) { return String(s || '').trim().toLocaleLowerCase('ko-KR'); }
function formatConfirmedAt(value) {
  if (!value) return '';
  const raw = String(value).trim();
  const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
  if (!match) return raw + ' 확인';
  const month = Number(match[2]);
  const day = Number(match[3]);
  const rest = match[4].trim();
  return `${month}.${day}${rest ? ' ' + rest : ''} 확인`;
}
function incidentFactText(inc) {
  const fatalities = Number(inc.fatalities || 1);
  return {
    primary: inc.status === '사망 확인' ? `사망 ${fatalities}명` : inc.status,
    secondary: formatConfirmedAt(inc.confirmedAt) || `${inc.date} 확인`
  };
}
function incidentMarkerHtml(inc, compact) {
  const text = incidentFactText(inc);
  return `<button class="incident-marker${compact ? ' compact' : ''}" type="button" aria-label="${text.primary}, ${text.secondary}">
    <span class="label">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="text"><span class="primary">${text.primary}</span><span class="secondary">${text.secondary}</span></span>
    </span>
    <span class="anchor" aria-hidden="true"></span>
  </button>`;
}
function distanceLabel(point) {
  if (!state.userLocation) return '';
  const km = haversineKm(state.userLocation, point);
  return km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;
}
function formatDistance(point, origin) {
  const km = haversineKm(origin, point);
  return km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;
}
function helpTypeLabel(type) {
  return type === 'police' ? '경찰' : '병원';
}
function helpTypeTitle(type) {
  return type === 'police' ? '가까운 경찰서' : '가까운 병원';
}
function fallbackNearestHelp(origin) {
  return ['police', 'hospital'].map(type => FALLBACK_HELP_PLACES
    .filter(place => place.type === type)
    .map(place => ({ ...place, distanceKm: haversineKm(origin, place) }))
    .sort((a, b) => a.distanceKm - b.distanceKm)[0]);
}
function fallbackPlaceSearchResults(query) {
  const q = norm(query);
  const categoryMatch = p => {
    const haystack = norm([p.name, p.addr, ...p.keys].join(' '));
    if (['호텔', '숙소'].includes(q)) return /호텔|하얏트|글래드|라마다|파르나스|신라/.test(haystack);
    if (['식당', '음식점', '맛집'].includes(q)) return /고집돌우럭|연돈|김밥|국수|돈까스|우럭/.test(haystack);
    if (q === '카페') return /카페|노티드|애월/.test(haystack);
    if (q === '해변') return /해변|해수욕장|협재|함덕|곽지|월정리|이호테우/.test(haystack);
    if (['관광지', '장소'].includes(q)) return true;
    return false;
  };
  const places = FALLBACK_PLACES
    .filter(p => categoryMatch(p) || p.keys.some(k => norm(k).includes(q) || q.includes(norm(k))))
    .map(p => ({ name: p.name, addr: p.addr, lat: p.lat, lng: p.lng }));
  const regions = state.pop ? state.pop.regions
    .filter(r => norm(r.name).includes(q) || q.includes(norm(r.name)))
    .map(r => ({ name: r.name, addr: '제주특별자치도 ' + r.name, lat: r.lat, lng: r.lng })) : [];
  return [...places, ...regions].slice(0, 20);
}
function showToast(message, duration) {
  const t = document.getElementById('toast');
  t.textContent = message;
  t.hidden = false;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => { t.hidden = true; }, 350); }, duration || 3600);
}
function popStyle(regions) {
  const totals = regions.map(r => r.total).sort((a, b) => a - b);
  const q = p => totals[Math.min(totals.length - 1, Math.floor(totals.length * p))];
  const cuts = [q(.2), q(.4), q(.6), q(.8)];
  // 5단계: 진한 주황(가장 한적) → 진한 파랑(가장 붐빔). 색약에도 안전한 조합.
  // 초록 계열은 브랜드 전용이므로 데이터 색에서 뺀다. 범례 그라데이션과 함께 갱신할 것.
  const COLORS = ['#d35400', '#f0a35e', '#d9d4c5', '#7fa8d9', '#2a5ca8'];
  const tier = t => cuts.findIndex(c => t < c) === -1 ? 4 : cuts.findIndex(c => t < c);
  return { color: t => COLORS[tier(t)],
           tag: t => ['가장 한적', '한적', '보통', '붐빔', '가장 붐빔'][tier(t)] };
}
function regionRanks(regions) {
  const quiet = [...regions].sort((a, b) => a.total - b.total);
  const byName = Object.fromEntries(quiet.map((r, index) => [r.name, {
    quietRank: index + 1,
    crowdRank: quiet.length - index,
    totalRegions: quiet.length
  }]));
  return { quiet, byName };
}
function nearbyIncidentContext(point, radiusKm) {
  const nearby = state.data.incidents
    .map(i => ({ i, km: haversineKm(point, i) }))
    .filter(x => x.km <= radiusKm)
    .sort((a, b) => a.km - b.km);
  return {
    nearby,
    label: nearby.length >= 3 ? '보도 사건 높음' : nearby.length ? '보도 사건 있음' : '보도 사건 낮음',
    detail: nearby.length ? `반경 ${radiusKm}km 보도 확인 사건 ${nearby.length}건 (최근접 ${nearby[0].km.toFixed(1)}km)` : `반경 ${radiusKm}km 보도 확인 사건 없음`,
    alert: nearby.length > 0
  };
}
function regionPopulationContext(region, style, ranks) {
  const rank = ranks.byName[region.name];
  return {
    color: style.color(region.total),
    tag: style.tag(region.total),
    quietRank: rank ? rank.quietRank : 0,
    crowdRank: rank ? rank.crowdRank : 0,
    totalRegions: rank ? rank.totalRegions : state.pop.regions.length,
    people: fmt(region.total)
  };
}
function regionLabelHtml(region, pop, incident, mode) {
  if (mode === 'mid') return `${region.name}<small>${pop.tag}</small>`;
  return `${region.name}<small>${pop.people}명 · 한적 ${pop.quietRank}위 · ${incident.label}</small>`;
}

function renderList() {
  const el = listView; el.innerHTML = '';
  if (state.tab === 'incident') {
    const rows = state.data.incidents;
    resultMeta.innerHTML = `<span>장소 입력 후 Enter로 점검</span><span>사건 <b>${rows.length}</b>건 참고</span>`;
    rows.forEach(inc => {
      const fact = incidentFactText(inc);
      const d = document.createElement('div'); d.className = 'item';
      d.tabIndex = 0;
      d.innerHTML = `<span class="dot" style="background:var(--accent)"></span>
        <div class="t"><b>${inc.title}</b><span>${inc.area} · ${fact.secondary}</span>${state.userLocation ? `<span class="distance">내 위치에서 ${distanceLabel(inc)}</span>` : ''}</div>
        <span class="badge" style="background:var(--accent)">${inc.status}</span>`;
      d.onclick = () => { mapApi.panTo(inc.lat, inc.lng, 7); incidentDetail(inc); };
      d.onkeydown = e => { if (e.key === 'Enter') d.click(); };
      el.appendChild(d);
    });
  } else if (state.pop) {
    const style = popStyle(state.pop.regions);
    const ranks = regionRanks(state.pop.regions);
    const sorted = ranks.quiet;
    const max = sorted.length ? sorted[sorted.length - 1].total : 1;
    resultMeta.innerHTML = `<span>장소 입력 후 Enter로 점검</span><span>지역 <b>${sorted.length}</b>곳 참고</span>`;
    sorted.forEach(r => {
      const pop = regionPopulationContext(r, style, ranks);
      const incidents = nearbyIncidentContext(r, 8);
      const c = pop.color;
      const d = document.createElement('div'); d.className = 'item';
      d.tabIndex = 0;
      d.innerHTML = `<span class="dot" style="background:${c}"></span>
        <div class="t"><b>${r.name}</b><span>${pop.tag} · 한적 ${pop.quietRank}위 · 붐빔 ${pop.crowdRank}위</span>
        <div class="metrics"><span class="metric-pill">${pop.totalRegions}곳 중 ${pop.quietRank}위</span><span class="metric-pill${incidents.alert ? ' alert' : ''}">${incidents.label}</span></div>
        ${state.userLocation ? `<span class="distance">내 위치에서 ${distanceLabel(r)}</span>` : ''}</div>

    });
  }

  if (on && !localStorage.getItem('cctvHintShown')) {
    localStorage.setItem('cctvHintShown', '1');
    showToast('공공 CCTV 위치를 표시합니다. 방범 전용이 아니며 실제 촬영 범위나 작동 상태를 보장하는 정보는 아닙니다.', 7000);
  }
}

function wireChip(id, onToggle, defaultOn) {
  const chip = document.getElementById(id);
  chip.hidden = false;
  chip.onclick = function () { onToggle(this.classList.toggle('on')); };
  if (defaultOn) { chip.classList.add('on'); onToggle(true); }
  return chip;
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}
function renderPlaceResults(query, places, onPick) {
  const result = document.getElementById('card-result');
  if (!places.length) {
    result.innerHTML = `<div class="card-hint"><b>${escapeHtml(query)}</b> 위치를 찾지 못했습니다. 호텔명, 음식점명, 해변명처럼 장소 이름을 조금 더 구체적으로 입력해 주세요.</div>`;
    return;
  }
  const label = places.length === 1 ? '검색 결과 1곳' : `검색 결과 ${places.length}곳`;
  result.innerHTML = `
    <div class="card-hint"><b>${escapeHtml(query)}</b> ${label}입니다. 점검할 장소를 선택하세요.</div>
    <div class="place-results">
      ${places.map((p, index) => `
        <button class="place-result" type="button" data-place-index="${index}">
          <b>${escapeHtml(p.name)}</b>
          <span>${escapeHtml(p.addr || '주소 정보 없음')}</span>
        </button>`).join('')}
    </div>`;
  result.querySelectorAll('.place-result').forEach(button => {
    button.onclick = () => onPick(places[Number(button.dataset.placeIndex)]);
  });
}
function openMapPlaceInspector(title, hint) {
  showDetail(`
    <h2>${escapeHtml(title)}</h2>
    <div id="card-result" class="card-hint">${escapeHtml(hint)}</div>`);
}

function renderSafetyCard(loc, cfg, moveToLocation) {

  const ranks = regionRanks(state.pop.regions);
  const region = state.pop.regions.reduce((a, r) => haversineKm(loc, r) < haversineKm(loc, a) ? r : a);
  const pop = regionPopulationContext(region, style, ranks);
  const incidents = nearbyIncidentContext(loc, 8);
  const summaryText = `${loc.name} 안전 점검: ${incidents.detail}. ${region.name}은 통신사 유동인구 기준 "${pop.tag}", 한적한 순 ${pop.quietRank}위 지역입니다.`;
  document.getElementById('card-result').innerHTML = `
    <div class="safety-card" id="the-card">
      <h3>${loc.name} 안전 점검</h3>
      <div class="addr">${loc.addr}</div>
      <div class="context">
        <div class="context-box"><span>지역 붐빔도</span><b><span class="tagchip" style="background:${pop.color}">${pop.tag}</span></b></div>
        <div class="context-box"><span>보도 사건 맥락</span><b style="color:${incidents.alert ? 'var(--accent)' : 'inherit'}">${incidents.label}</b></div>
      </div>
      <div class="row"><span>반경 8km 내 보도 확인 사건</span><b style="color:${incidents.alert ? 'var(--accent)' : 'inherit'}">${incidents.nearby.length ? incidents.nearby.length + '건 (최근접 ' + incidents.nearby[0].km.toFixed(1) + 'km)' : '없음'}</b></div>
      <div class="row"><span>지역 (${region.name})</span><b>${pop.totalRegions}곳 중 한적 ${pop.quietRank}위</b></div>
      <div class="row"><span>하루 유동인구</span><b>약 ${region.total.toLocaleString()}명</b></div>
      <div class="brand">공유용 요약 · 제주안전맵 · ${state.pop.day.slice(0,4)}.${state.pop.day.slice(4,6)} 통신사 데이터 + 언론 보도 기준</div>
    </div>
    <div class="card-actions">
      <button id="card-save">이미지 저장</button>
      <button id="card-kakao" class="kakao">카톡 공유</button>
      <button id="card-copy">요약 복사</button>
    </div>
    <div class="card-hint">친구에게 보내기 좋은 요약입니다. 안전 판정이 아니라 공개 보도와 통신사 유동인구를 한 번에 확인하는 참고 자료입니다.</div>`;
  gtag('event', 'card_create', { region: region.name, incidents_8km: incidents.nearby.length });
  moveToLocation(loc);
  returnJejuBtn.hidden = false;

  document.getElementById('card-save').onclick = async () => {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const canvas = await html2canvas(document.getElementById('the-card'), { scale: 2, backgroundColor: '#fff' });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png'); a.download = '제주안전지도_점검카드.png'; a.click();
    gtag('event', 'card_share', { method: 'image' });
  };
  document.getElementById('card-kakao').onclick = async () => {
    if (!window.Kakao) await loadScript('https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js');
    if (!Kakao.isInitialized()) Kakao.init(cfg.kakaoKey);
    Kakao.Share.sendDefault({
      objectType: 'text',
      text: '내 숙소 안전 점검 결과\n' + summaryText,

      buttonTitle: '내 숙소도 점검하기'
    });
    gtag('event', 'card_share', { method: 'kakao' });
  };
  document.getElementById('card-copy').onclick = async () => {
    await navigator.clipboard.writeText(summaryText + '\nhttps://jeju.kimyukah.com');
    document.getElementById('card-copy').textContent = '복사됨!';
    gtag('event', 'card_share', { method: 'copy' });
  };
}

// ── 안전 점검 카드: 주소 검색 → 요약 카드 → 저장/공유 (카카오맵 엔진 전용) ──
function setupCard(map, cfg) {
  if (!state.pop) return;
  const btn = document.getElementById('check-btn');
  btn.hidden = true;
  const geocoder = new kakao.maps.services.Geocoder();
  const places = new kakao.maps.services.Places();
  let marker = null;
  const placeCategories = ['MT1', 'CS2', 'PS3', 'SC4', 'AC5', 'PK6', 'OL7', 'SW8', 'BK9', 'CT1', 'AG2', 'PO3', 'AT4', 'AD5', 'FD6', 'CE7', 'HP8', 'PM9'];

  const search = q => new Promise(resolve => {
    geocoder.addressSearch(q, (res, st) => {
      if (st === kakao.maps.services.Status.OK && res[0])
        return resolve([{ name: q, addr: res[0].address_name, lat: +res[0].y, lng: +res[0].x }]);
      places.keywordSearch(q + ' 제주', (res2, st2) => {
        if (st2 === kakao.maps.services.Status.OK && res2.length)
          return resolve(res2.slice(0, 15).map(place => ({
            name: place.place_name,
            addr: place.road_address_name || place.address_name,
            lat: +place.y,
            lng: +place.x
          })));
        resolve([]);
      });
    });
  });
  const nearbyPlaces = latLng => Promise.all(placeCategories.map(category => new Promise(resolve => {
    places.categorySearch(category, (res, st) => {
      if (st !== kakao.maps.services.Status.OK) {
        resolve([]);
        return;
      }
      resolve(res.map(place => ({
        id: place.id,
        name: place.place_name,
        addr: place.road_address_name || place.address_name,
        lat: +place.y,
        lng: +place.x,
        distance: Number(place.distance || 0)
      })));
    }, { location: latLng, radius: 120, sort: kakao.maps.services.SortBy.DISTANCE });
  }))).then(groups => {
    const seen = new Set();
    return groups.flat()
      .filter(place => {
        const key = place.id || `${place.name}|${place.addr}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a, b) => a.distance - b.distance)
      .slice(0, 15);
  });

  function renderCard(loc) {
    renderSafetyCard(loc, cfg, place => {
      if (marker) marker.setMap(null);
      marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(place.lat, place.lng), map });
      map.setLevel(6);
      map.panTo(new kakao.maps.LatLng(place.lat, place.lng));
    });
  }

  const openSafetyCheck = query => {
    const submitted = (query || '').trim();
    showDetail(`
      <h2>장소 안전 점검</h2>
      ${submitted ? '' : `
        <div class="card-input">
          <input id="addr-input" type="text" placeholder="호텔·식당·카페·해변 이름" enterkeyhint="search">
          <button id="addr-go">확인</button>
        </div>`}
      <div id="card-result" class="card-hint">호텔·숙소·식당·카페·해변 이름을 입력하면 주변 사건과 지역 붐빔도를 공유 가능한 카드로 요약합니다.</div>`);
    const go = async () => {
      const input = document.getElementById('addr-input');
      const q = submitted || (input ? input.value.trim() : '');
      if (!q) return;
      document.getElementById('card-result').textContent = '검색 중...';
      const matches = await search(q);
      if (matches.length === 1) {
        renderCard(matches[0]);
        return;
      }
      renderPlaceResults(q, matches, renderCard);
    };
    if (submitted) {
      go();
    } else {
      const input = document.getElementById('addr-input');
      document.getElementById('addr-go').onclick = go;
      input.onkeydown = e => { if (e.key === 'Enter') go(); };
      input.focus();
    }
    gtag('event', 'card_open');
  };
  btn.onclick = () => openSafetyCheck('');
  mapApi.inspectPoint = async latLng => {
    openMapPlaceInspector('지도에서 누른 장소', '주변 장소 정보를 찾고 있습니다...');
    const matches = await nearbyPlaces(latLng);
    if (!matches.length) {
      document.getElementById('card-result').innerHTML =
        '<div class="card-hint">이 지점 주변에서 제공사가 공개한 장소 정보를 찾지 못했습니다. 지도 글자 자체가 아니라 장소 데이터 API 기준이라, 일부 아파트나 작은 건물은 나오지 않을 수 있습니다.</div>';
      return;
    }
    renderPlaceResults('선택 지점 주변', matches, renderCard);
    if (window.matchMedia('(max-width: 899px)').matches) panel.classList.add('half');
    gtag('event', 'map_place_lookup', { result_count: matches.length });
  };
  mapApi.checkPlace = query => {
    if (!query) {
      showToast('호텔·숙소·장소 이름을 입력해 주세요.');
      searchInput.focus();
      return;
    }
    searchClear.hidden = false;
    openSafetyCheck(query);
  };
}

// ── 카카오맵 엔진 ──
async function initKakao(cfg) {
  await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${cfg.kakaoKey}&autoload=false&libraries=clusterer,services`);
  await new Promise(ok => kakao.maps.load(ok));
  const map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(CENTER.lat, CENTER.lng), level: 10
  });
  mapApi.panTo = (lat, lng, level) => {
    if (level != null && map.getLevel() > level) map.setLevel(level);
    map.panTo(new kakao.maps.LatLng(lat, lng));
  };
  mapApi.returnToJeju = () => {
    map.setLevel(10);
    map.panTo(new kakao.maps.LatLng(CENTER.lat, CENTER.lng));
  };
  let userOverlay = null;
  mapApi.setUserLocation = (lat, lng) => {
    const pos = new kakao.maps.LatLng(lat, lng);
    if (!userOverlay) {
      userOverlay = new kakao.maps.CustomOverlay({
        content: '<span class="user-loc-dot" aria-label="내 위치"></span>',
        yAnchor: .5,
        zIndex: 60
      });
    }
    userOverlay.setPosition(pos);
    userOverlay.setMap(map);
  };
  const helpPlaces = new kakao.maps.services.Places();
  let helpOverlays = [];
  const clearHelpOverlays = () => {
    helpOverlays.forEach(overlay => overlay.setMap(null));
    helpOverlays = [];
  };
  mapApi.clearNearestHelp = clearHelpOverlays;
  const searchHelpCategory = (origin, type, code) => new Promise(resolve => {
    const center = new kakao.maps.LatLng(origin.lat, origin.lng);
    helpPlaces.categorySearch(code, (res, status) => {
      if (status !== kakao.maps.services.Status.OK || !res.length) {
        resolve(null);
        return;
      }
      const place = res[0];
      resolve({
        type,
        name: place.place_name,
        addr: place.road_address_name || place.address_name,
        lat: Number(place.y),
        lng: Number(place.x),
        phone: place.phone || (type === 'police' ? '112' : '119'),
        distanceKm: Number(place.distance || 0) / 1000
      });
    }, { location: center, radius: 20000, sort: kakao.maps.services.SortBy.DISTANCE });
  });
  const nearestKakaoHelp = async origin => {
    const fallback = fallbackNearestHelp(origin);
    const found = await Promise.all([
      searchHelpCategory(origin, 'police', 'PO3'),
      searchHelpCategory(origin, 'hospital', 'HP8')
    ]);
    return found.map((place, index) => place || fallback[index]);
  };
  const showHelpOverlays = places => {
    clearHelpOverlays();
    helpOverlays = places.map(place => {
      const el = document.createElement('button');
      el.className = `help-marker ${place.type}`;
      el.type = 'button';
      el.textContent = helpTypeLabel(place.type);
      el.setAttribute('aria-label', `${helpTypeTitle(place.type)} ${place.name}`);
      el.onclick = () => {
        mapApi.panTo(place.lat, place.lng, 5);
        renderNearestHelp(state.userLocation || place, places);
      };
      const overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(place.lat, place.lng),
        content: el,
        yAnchor: 1,
        zIndex: 70
      });
      overlay.setMap(map);
      return overlay;
    });
  };
  mapApi.showNearestHelp = async loc => {
    const places = await nearestKakaoHelp(loc);
    showHelpOverlays(places);
    renderNearestHelp(loc, places);
  };

  // 사건: 축소하면 숫자 클러스터, 확대하면 개별 핀 (거지맵 패턴)
  const clusterer = new kakao.maps.MarkerClusterer({
    map, averageCenter: true, minLevel: 9, gridSize: 80,
    styles: [{ width: '40px', height: '40px', background: 'rgba(192,57,43,.95)', color: '#fff',
      borderRadius: '50%', border: '3px solid #fff', textAlign: 'center', lineHeight: '35px',
      fontWeight: '700', fontSize: '15px', boxShadow: '0 2px 10px rgba(0,0,0,.35)' }]
  });
  const pinImg = new kakao.maps.MarkerImage(
    'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#c0392b" stroke="#fff" stroke-width="3"/></svg>'),
    new kakao.maps.Size(22, 22), { offset: new kakao.maps.Point(11, 11) });
  const markers = state.data.incidents.map(inc => {
    const m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(inc.lat, inc.lng), image: pinImg });
    kakao.maps.event.addListener(m, 'click', () => { incidentDetail(inc); mapApi.panTo(inc.lat, inc.lng); });
    return m;
  });
  let incidentOn = true;
  const incidentLabels = state.data.incidents.map(inc => {
    const el = document.createElement('div');
    el.innerHTML = incidentMarkerHtml(inc, true);
    el.firstElementChild.onclick = () => { incidentDetail(inc); mapApi.panTo(inc.lat, inc.lng); };
    const ov = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(inc.lat, inc.lng),
      content: el.firstElementChild,
      yAnchor: 1,
      zIndex: 45
    });
    return ov;
  });
  const relabelIncidents = () => {
    const showLabels = incidentOn && map.getLevel() <= 8;
    incidentLabels.forEach(ov => ov.setMap(showLabels ? map : null));
  };
  kakao.maps.event.addListener(map, 'zoom_changed', relabelIncidents);
  clusterer.addMarkers(markers);
  document.getElementById('chip-incident').onclick = function () {
    incidentOn = this.classList.toggle('on');
    if (incidentOn) clusterer.addMarkers(markers);
    else clusterer.removeMarkers(markers);
    relabelIncidents();
  };
  relabelIncidents();

  // 유동인구: 읍면동 경계를 한적함으로 채색 + 숫자 라벨 (기본 켜짐)
  // 사건이 있는 지역은 빨간 테두리. "위험도 점수"가 아니라 사실(사람 수·사건 유무)만 칠한다.
  if (state.pop) {
    const style = popStyle(state.pop.regions);
    const ranks = regionRanks(state.pop.regions);
    const byName = Object.fromEntries(state.pop.regions.map(r => [r.name, r]));
    let polygons = [];
    try {
      const geo = await (await fetch('data/regions.geojson')).json();
      const toPaths = g => (g.type === 'Polygon' ? [g.coordinates] : g.coordinates)
        .map(poly => poly[0].map(([lng, lat]) => new kakao.maps.LatLng(lat, lng)));
      geo.features.forEach(f => {
        const r = byName[f.properties.name]; if (!r) return;
        const p = new kakao.maps.Polygon({
          path: toPaths(f.geometry),
          strokeWeight: 1, strokeColor: '#8e8e93', strokeOpacity: .5,
          fillColor: style.color(r.total), fillOpacity: .35
        });
        kakao.maps.event.addListener(p, 'click', () => {
          regionDetail(r, style, ranks);
        });
        polygons.push(p);
      });
    } catch (e) {}
    let popOn = false;
    const overlays = state.pop.regions.map(r => {
      const el = document.createElement('div');
      el.className = 'pop-num'; el.style.borderColor = style.color(r.total); el.style.color = style.color(r.total);
      el.onclick = () => { regionDetail(r, style, ranks); mapApi.panTo(r.lat, r.lng); };
      const ov = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(r.lat, r.lng), content: el, yAnchor: .5, zIndex: 20 });
      return { ov, el, r };
    });
    // 축소: 색만(라벨 숨김) / 중간: 지역명 / 확대: 지역명+맥락 있는 숫자.
    // 숫자만 단독으로 띄우면 무슨 수인지 알 수 없다는 피드백 반영.
    const relabel = () => {
      const lv = map.getLevel();
      overlays.forEach(({ ov, el, r }) => {
        if (lv >= 10) { ov.setMap(null); return; }
        if (popOn) ov.setMap(map);
        const expanded = lv < 8;
        el.classList.toggle('expanded', expanded);
        el.innerHTML = regionLabelHtml(r, regionPopulationContext(r, style, ranks), nearbyIncidentContext(r, 8), expanded ? 'expanded' : 'mid');
      });
    };
    kakao.maps.event.addListener(map, 'zoom_changed', relabel);
    wireChip('chip-pop', on => {
      popOn = on;
      polygons.forEach(p => p.setMap(on ? map : null));
      if (on) relabel(); else overlays.forEach(o => o.ov.setMap(null));
      document.getElementById('legend').hidden = !on;
      gtag('event', 'layer_toggle', { layer: 'population', on });
    }, true);
  }

  if (state.cctv) {
    let cctvOn = false;
    const overlays = state.cctv.points.map(([lat, lng, count, purpose]) => {
      const el = document.createElement('button');
      el.className = 'cctv-dot';
      el.type = 'button';
      el.setAttribute('aria-label', `공공 CCTV ${count}대, ${purpose || '목적 미상'}`);
      el.onclick = () => {
        mapApi.panTo(lat, lng, 6);
        showToast(`이 지점에 공공 CCTV ${count}대가 등록되어 있습니다. 목적: ${purpose || '미상'}`);
        gtag('event', 'cctv_open');
      };
      const ov = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(lat, lng),
        content: el,
        yAnchor: .5,
        zIndex: 30
      });
      return { ov, el, count };
    });
    const relabelCctv = () => {
      const close = map.getLevel() <= 7;
      overlays.forEach(({ ov, el, count }) => {
        if (cctvOn) ov.setMap(map);
        el.textContent = close ? count : '';
        el.classList.toggle('count', close);
      });
    };
    kakao.maps.event.addListener(map, 'zoom_changed', relabelCctv);
    wireChip('chip-cctv', on => {
      cctvOn = on;
      if (on) relabelCctv(); else overlays.forEach(o => o.ov.setMap(null));
      cctvUi(on);
      gtag('event', 'layer_toggle', { layer: 'cctv', on });
    }, false);
  }

  // 범죄주의구간 WMS: 화면 bbox 이미지를 CustomOverlay로 덮고 idle마다 갱신
  if (cfg.safemapKey) {
    const img = document.createElement('img');
    img.style.cssText = 'opacity:.5;pointer-events:none;';
    // 앵커를 뷰포트 모서리에 두면 카카오가 화면 밖 판정으로 오버레이를 컬링해서
    // DOM에 안 붙는다. 중앙 앵커(0.5)로 두고 이미지가 화면 전체를 덮게 한다.
    const overlay = new kakao.maps.CustomOverlay({ content: img, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5 });
    let on = false;
    const refresh = () => {
      if (!on) return;
      const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
      const proj = map.getProjection();
      const p1 = proj.containerPointFromCoords(new kakao.maps.LatLng(ne.getLat(), sw.getLng()));
      const p2 = proj.containerPointFromCoords(new kakao.maps.LatLng(sw.getLat(), ne.getLng()));
      img.width = Math.round(p2.x - p1.x); img.height = Math.round(p2.y - p1.y);
      img.src = `${CRIME_WMS}?serviceKey=${cfg.safemapKey}&request=GetMap&layers=A2SM_CRMNLHSPOT_TOT&styles=A2SM_CrmnlHspot_Tot_Tot&format=image/png&transparent=TRUE&version=1.1.1&srs=EPSG:4326&bbox=${sw.getLng()},${sw.getLat()},${ne.getLng()},${ne.getLat()}&width=${img.width}&height=${img.height}`;
      overlay.setPosition(map.getCenter());
      overlay.setMap(map);
    };
    kakao.maps.event.addListener(map, 'idle', refresh);
    // 기본 켜짐: 존재를 알리는 게 중요하다는 판단. 단 첫 화면은 도 전체 뷰를 유지하고,
    // 사용자가 직접 켤 때만 시내 축척(격자가 보이는)으로 데려간다.
    let initialOn = true;
    wireChip('chip-crime', v => {
      on = v;
      if (on) {
        if (!initialOn && map.getLevel() >= 9) { map.setLevel(7); map.panTo(new kakao.maps.LatLng(33.505, 126.525)); }
        refresh();
      } else overlay.setMap(null);
      crimeUi(on);
      if (!initialOn) gtag('event', 'layer_toggle', { layer: 'crime_zone', on });
      initialOn = false;
    }, true);
  }
  setupCard(map, cfg);
  kakao.maps.event.addListener(map, 'click', mouseEvent => {
    if (!state.pop || !mapApi.inspectPoint) return;
    mapApi.inspectPoint(mouseEvent.latLng);
  });
  return 'kakao';
}

// ── OSM(Leaflet) 폴백: 클러스터 없이 기본 표시만 ──
async function initLeaflet(cfg) {
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  const map = L.map('map', { zoomControl: false }).setView([CENTER.lat, CENTER.lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  mapApi.panTo = (lat, lng, level) => map.setView([lat, lng], Math.max(map.getZoom(), 12));
  mapApi.returnToJeju = () => map.setView([CENTER.lat, CENTER.lng], 10);
  let userMarker = null;
  mapApi.setUserLocation = (lat, lng) => {
    const icon = L.divIcon({ html: '<span class="user-loc-dot" aria-label="내 위치"></span>', className: '', iconSize: [18, 18] });
    if (!userMarker) {
      userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
      return;
    }
    userMarker.setLatLng([lat, lng]);
  };
  let helpLayer = null;
  mapApi.clearNearestHelp = () => {
    if (helpLayer) map.removeLayer(helpLayer);
    helpLayer = null;
  };
  mapApi.showNearestHelp = loc => {
    const places = fallbackNearestHelp(loc);
    mapApi.clearNearestHelp();
    helpLayer = L.layerGroup();
    places.forEach(place => {
      L.marker([place.lat, place.lng], {
        icon: L.divIcon({
          html: `<button class="help-marker ${place.type}" type="button" aria-label="${helpTypeTitle(place.type)} ${escapeHtml(place.name)}">${helpTypeLabel(place.type)}</button>`,
          className: '',
          iconSize: [42, 28],
          iconAnchor: [21, 28]
        }),
        zIndexOffset: 1100
      }).addTo(helpLayer).on('click', () => {
        mapApi.panTo(place.lat, place.lng, 5);
        renderNearestHelp(loc, places);
      });
    });
    helpLayer.addTo(map);
    renderNearestHelp(loc, places);
  };

  const incidentLayer = L.layerGroup();
  state.data.incidents.forEach(inc => {
    L.marker([inc.lat, inc.lng], { icon: L.divIcon({ html: incidentMarkerHtml(inc, true), className: '', iconSize: [132, 68], iconAnchor: [66, 68] }) })
      .addTo(incidentLayer).on('click', event => { L.DomEvent.stopPropagation(event); incidentDetail(inc); });
  });
  incidentLayer.addTo(map);
  document.getElementById('chip-incident').onclick = function () {
    this.classList.toggle('on') ? incidentLayer.addTo(map) : map.removeLayer(incidentLayer);
  };
  if (state.pop) {
    const style = popStyle(state.pop.regions);
    const ranks = regionRanks(state.pop.regions);
    const byName = Object.fromEntries(state.pop.regions.map(r => [r.name, r]));
    const layer = L.layerGroup();
    try {
      const geo = await (await fetch('data/regions.geojson')).json();
      L.geoJSON(geo, {
        style: f => {
          const r = byName[f.properties.name];
          return { color: '#8e8e93', weight: 1, opacity: .5,
                   fillColor: r ? style.color(r.total) : '#ccc', fillOpacity: .35 };
        },
        onEachFeature: (f, l) => l.on('click', event => {
          L.DomEvent.stopPropagation(event);
          const r = byName[f.properties.name]; if (!r) return;
          regionDetail(r, style, ranks);
        })
      }).addTo(layer);
    } catch (e) {}
    const popMarkers = state.pop.regions.map(r => {
      const iconFor = expanded => L.divIcon({
        html: `<button class="pop-num${expanded ? ' expanded' : ''}" type="button" style="border-color:${style.color(r.total)};color:${style.color(r.total)}">${regionLabelHtml(r, regionPopulationContext(r, style, ranks), nearbyIncidentContext(r, 8), expanded ? 'expanded' : 'mid')}</button>`,
        className: '',
        iconSize: expanded ? [126, 44] : [88, 36],
        iconAnchor: expanded ? [63, 22] : [44, 18]
      });
      const marker = L.marker([r.lat, r.lng], { icon: iconFor(false), zIndexOffset: 200 }).addTo(layer).on('click', event => {
        L.DomEvent.stopPropagation(event);
        regionDetail(r, style, ranks);
      });
      return { marker, iconFor };
    });
    const relabelPop = () => {
      const expanded = map.getZoom() >= 12;
      popMarkers.forEach(({ marker, iconFor }) => marker.setIcon(iconFor(expanded)));
    };
    map.on('zoomend', relabelPop);
    wireChip('chip-pop', on => {
      if (on) { layer.addTo(map); relabelPop(); } else map.removeLayer(layer);
      document.getElementById('legend').hidden = !on;
    }, true);
    let placeMarker = null;
    const openFallbackSafetyCheck = query => {
      const submitted = (query || '').trim();
      showDetail(`
        <h2>장소 안전 점검</h2>
        ${submitted ? '' : `
          <div class="card-input">
            <input id="addr-input" type="text" placeholder="호텔·식당·카페·해변 이름" enterkeyhint="search">
            <button id="addr-go">확인</button>
          </div>`}
        <div id="card-result" class="card-hint">카카오 장소검색을 쓸 수 없는 환경이라 제주 주요 장소와 읍면동 이름으로 점검합니다.</div>`);
      const go = () => {
        const input = document.getElementById('addr-input');
        const q = submitted || (input ? input.value.trim() : '');
        if (!q) return;
        document.getElementById('card-result').textContent = '검색 중...';
        const matches = fallbackPlaceSearchResults(q);
        const renderFallbackCard = loc => renderSafetyCard(loc, cfg, place => {
          const icon = L.divIcon({ html: '<span class="user-loc-dot" aria-label="검색한 장소"></span>', className: '', iconSize: [18, 18] });
          if (!placeMarker) placeMarker = L.marker([place.lat, place.lng], { icon, zIndexOffset: 900 }).addTo(map);
          else placeMarker.setLatLng([place.lat, place.lng]);
          map.setView([place.lat, place.lng], 12);
        });
        if (matches.length === 1) {
          renderFallbackCard(matches[0]);
          return;
        }
        renderPlaceResults(q, matches, renderFallbackCard);
      };
      if (submitted) {
        go();
      } else {
        const input = document.getElementById('addr-input');
        document.getElementById('addr-go').onclick = go;
        input.onkeydown = e => { if (e.key === 'Enter') go(); };
        input.focus();
      }
      gtag('event', 'card_open', { engine: 'osm' });
    };
    mapApi.checkPlace = query => {
      if (!query) {
        showToast('호텔·숙소·장소 이름을 입력해 주세요.');
        searchInput.focus();
        return;
      }
      searchClear.hidden = false;
      openFallbackSafetyCheck(query);
    };
  }
  if (cfg.safemapKey) {
    const wms = L.tileLayer.wms(CRIME_WMS, {
      layers: 'A2SM_CRMNLHSPOT_TOT', styles: 'A2SM_CrmnlHspot_Tot_Tot',
      format: 'image/png', transparent: true, version: '1.1.1',
      serviceKey: cfg.safemapKey, opacity: .45
    });
    wireChip('chip-crime', on => { on ? wms.addTo(map) : map.removeLayer(wms); crimeUi(on); }, true);
  }
  if (state.cctv) {
    const layer = L.layerGroup();
    const cctvMarkers = state.cctv.points.map(([lat, lng, count, purpose]) => {
      const iconFor = close => L.divIcon({
        html: `<button class="cctv-dot${close ? ' count' : ''}" type="button" aria-label="공공 CCTV ${count}대, ${purpose || '목적 미상'}">${close ? count : ''}</button>`,
        className: '',
        iconSize: close ? [28, 18] : [18, 18]
      });
      const marker = L.marker([lat, lng], { icon: iconFor(false), zIndexOffset: 300 })
        .addTo(layer)
        .on('click', event => {
          L.DomEvent.stopPropagation(event);
          showToast(`이 지점에 공공 CCTV ${count}대가 등록되어 있습니다. 목적: ${purpose || '미상'}`);
        });
      return { marker, count, iconFor };
    });
    const relabelCctv = () => {
      const close = map.getZoom() >= 12;
      cctvMarkers.forEach(({ marker, iconFor }) => marker.setIcon(iconFor(close)));
    };
    map.on('zoomend', relabelCctv);
    wireChip('chip-cctv', on => {
      if (on) { layer.addTo(map); relabelCctv(); } else map.removeLayer(layer);
      cctvUi(on);
    }, false);
  }
  map.on('click', () => {
    openMapPlaceInspector('지도에서 누른 위치', '이 기본 지도는 화면에 그려진 건물·상호명을 클릭 데이터로 제공하지 않습니다. 상단 검색창에 호텔, 음식점, 카페, 해변 이름을 입력해 점검해 주세요.');
  });
  return 'osm';
}

(async () => {
  state.data = await (await fetch('data/incidents.json')).json();
  document.getElementById('stat-count').textContent = state.data.stats.unresolvedAdultMissing + '명';
  try { state.pop = await (await fetch('data/pop.json')).json(); } catch (e) {}
  try { state.cctv = await (await fetch('data/cctv.json')).json(); } catch (e) {}
  renderList();
  let cfg = {};
  try { const r = await fetch('config.json'); if (r.ok) cfg = await r.json(); } catch (e) {}
  let engine;
  try {
    engine = cfg.kakaoKey ? await initKakao(cfg) : await initLeaflet(cfg);
  } catch (e) {
    engine = await initLeaflet(cfg);
  }
  gtag('event', 'map_loaded', { incident_count: state.data.incidents.length, map_engine: engine });
})();
</script>
