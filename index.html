<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 안전지도 - 실종 사건 지도</title>
<meta name="description" content="제주 실종 사건과 안전 정보를 지도에서 확인하세요. 언론 보도 기반, 출처 링크 포함.">
<meta property="og:title" content="제주 안전지도">
<meta property="og:description" content="제주에서 최근 어디서 실종 사건이 있었는지 지도로 확인하세요.">
<!-- GA4: 측정 ID 발급 후 G-XXXXXXXXXX 교체 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XXXXXXXXXX');
</script>
<style>
:root { --ink:#1c1c1e; --sub:#6e6e73; --accent:#c0392b; --card:#ffffff; }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:var(--ink); }
#map { position:fixed; inset:0; }
.banner {
  position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; z-index:1000;
  background:var(--card); border-radius:14px; padding:12px 16px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
}
.banner h1 { font-size:16px; }
.banner p { font-size:13px; color:var(--sub); margin-top:4px; line-height:1.45; }
.banner strong { color:var(--accent); }
.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:var(--card); border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.2);
  transform:translateY(110%); transition:transform .25s ease;
  max-height:60vh; overflow-y:auto;
}
.sheet.open { transform:translateY(0); }
.sheet .status { display:inline-block; font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; margin-bottom:8px; }
.sheet h2 { font-size:17px; margin-bottom:2px; }
.sheet .area { font-size:13px; color:var(--sub); margin-bottom:10px; }
.sheet .summary { font-size:14px; line-height:1.6; margin-bottom:12px; }
.sheet .src { font-size:13px; }
.sheet .src a { color:#0a66c2; text-decoration:none; margin-right:10px; }
.sheet .close { position:absolute; top:10px; right:14px; border:0; background:none; font-size:22px; color:var(--sub); cursor:pointer; }
.foot {
  position:fixed; bottom:calc(8px + env(safe-area-inset-bottom)); left:12px; right:12px; z-index:900;
  font-size:11px; color:var(--sub); background:rgba(255,255,255,.88); border-radius:10px; padding:8px 12px; line-height:1.5;
}
.pin-dot { display:block; width:18px; height:18px; background:var(--accent); border:2px solid #fff; border-radius:50%; box-shadow:0 1px 6px rgba(0,0,0,.4); cursor:pointer; }
.pop-label { background:rgba(255,255,255,.95); border-radius:8px; padding:4px 8px; font-size:12px; box-shadow:0 1px 6px rgba(0,0,0,.25); white-space:nowrap; }
.pop-label small { color:var(--sub); }
.chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.chip { font-size:13px; border:1px solid #d1d1d6; background:#fff; color:var(--sub); border-radius:999px; padding:5px 12px; cursor:pointer; }
.chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.chip[hidden] { display:none; }
</style>
</head>
<body>
<div id="map"></div>

<header class="banner">
  <h1>제주 안전지도</h1>
  <p>최근 3년 7개월간 제주 성인 실종 미해결 <strong id="stat-count">15명</strong> (제주경찰청 전수조사).
  아래 핀은 언론 보도로 확인된 사건입니다.</p>
  <div class="chips">
    <button class="chip on" id="chip-incident">실종 사건</button>
    <button class="chip" id="chip-cctv" hidden>방범 CCTV</button>
    <button class="chip" id="chip-crime" hidden>범죄주의구간</button>
    <button class="chip" id="chip-pop" hidden>유동인구</button>
  </div>
</header>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="close" id="sheet-close" aria-label="닫기">&times;</button>
  <span class="status" id="s-status"></span>
  <h2 id="s-title"></h2>
  <div class="area" id="s-area"></div>
  <div class="summary" id="s-summary"></div>
  <div class="src" id="s-sources"></div>
</section>

<footer class="foot">
  사건 위치는 피해자 보호를 위해 읍면 중심 수준으로 표시했습니다. 정확한 지점이 아닙니다.
  모든 정보는 언론 보도와 공공데이터를 출처와 함께 정리한 것입니다.
</footer>

<script>
const CENTER = { lat: 33.38, lng: 126.53 };
const CRIME_WMS = 'https://www.safemap.go.kr/openapi2/IF_0087_WMS';
const sheet = document.getElementById('sheet');
document.getElementById('sheet-close').onclick = () => sheet.classList.remove('open');

function openSheet(inc) {
  document.getElementById('s-status').textContent = inc.status;
  document.getElementById('s-title').textContent = inc.title;
  document.getElementById('s-area').textContent = inc.area + ' · ' + inc.date;
  document.getElementById('s-summary').textContent = inc.summary;
  document.getElementById('s-sources').innerHTML =
    '출처: ' + inc.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join('');
  sheet.classList.add('open');
  gtag('event', 'incident_open', { incident_id: inc.id });
}

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

function wireChip(id, onToggle) {
  const chip = document.getElementById(id);
  chip.hidden = false;
  chip.onclick = function () { onToggle(this.classList.toggle('on')); };
  return chip;
}

function popStyle(regions) {
  const totals = regions.map(r => r.total).sort((a, b) => a - b);
  const q = p => totals[Math.floor(totals.length * p)];
  const [lo, hi] = [q(1 / 3), q(2 / 3)];
  // 상위 1/3 청록(사람 많음), 하위 1/3 주황(인적 드묾). 판정이 아니라 사실(사람 수) 표시다.
  return { color: t => t >= hi ? '#0e7c7b' : t >= lo ? '#8e8e93' : '#e07b00' };
}

// ── 카카오맵 엔진 ─────────────────────────────────────────────
async function initKakao(data, cfg) {
  await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${cfg.kakaoKey}&autoload=false`);
  await new Promise(ok => kakao.maps.load(ok));
  const map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(CENTER.lat, CENTER.lng), level: 10
  });
  kakao.maps.event.addListener(map, 'click', () => sheet.classList.remove('open'));

  // 실종 사건 핀
  const pins = data.incidents.map(inc => {
    const el = document.createElement('span');
    el.className = 'pin-dot';
    el.onclick = e => { e.stopPropagation(); openSheet(inc); };
    return new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(inc.lat, inc.lng), content: el, yAnchor: .5, zIndex: 30
    });
  });
  const showPins = on => pins.forEach(p => p.setMap(on ? map : null));
  showPins(true);
  document.getElementById('chip-incident').onclick = function () {
    showPins(this.classList.toggle('on'));
  };

  // 범죄주의구간: 카카오맵은 WMS를 지원하지 않아서, 현재 화면 bbox로 WMS 이미지를
  // 한 장 받아 CustomOverlay로 덮고 idle마다 갱신한다.
  if (cfg.safemapKey) {
    const img = document.createElement('img');
    img.style.cssText = 'opacity:.55;pointer-events:none;';
    const overlay = new kakao.maps.CustomOverlay({ content: img, xAnchor: 0, yAnchor: 0, zIndex: 10 });
    let on = false;
    const refresh = () => {
      if (!on) return;
      const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
      const proj = map.getProjection();
      const p1 = proj.containerPointFromCoords(new kakao.maps.LatLng(ne.getLat(), sw.getLng()));
      const p2 = proj.containerPointFromCoords(new kakao.maps.LatLng(sw.getLat(), ne.getLng()));
      img.width = Math.round(p2.x - p1.x); img.height = Math.round(p2.y - p1.y);
      img.src = `${CRIME_WMS}?serviceKey=${cfg.safemapKey}&request=GetMap&layers=A2SM_CRMNLHSPOT_TOT&styles=A2SM_CrmnlHspot_Tot_Tot&format=image/png&transparent=TRUE&version=1.1.1&srs=EPSG:4326&bbox=${sw.getLng()},${sw.getLat()},${ne.getLng()},${ne.getLat()}&width=${img.width}&height=${img.height}`;
      overlay.setPosition(new kakao.maps.LatLng(ne.getLat(), sw.getLng()));
      overlay.setMap(map);
    };
    kakao.maps.event.addListener(map, 'idle', refresh);
    wireChip('chip-crime', v => {
      on = v; on ? refresh() : overlay.setMap(null);
      gtag('event', 'layer_toggle', { layer: 'crime_zone', on });
    });
  }

  // 유동인구 버블
  try {
    const pop = await (await fetch('data/pop.json')).json();
    const { color } = popStyle(pop.regions);
    const label = new kakao.maps.CustomOverlay({ yAnchor: 1.3, zIndex: 40 });
    const circles = pop.regions.map(r => {
      const c = new kakao.maps.Circle({
        center: new kakao.maps.LatLng(r.lat, r.lng),
        radius: 400 + Math.sqrt(r.total) * 6,
        strokeWeight: 1.5, strokeColor: color(r.total), strokeOpacity: .9,
        fillColor: color(r.total), fillOpacity: .3
      });
      kakao.maps.event.addListener(c, 'click', () => {
        label.setContent(`<div class="pop-label">${r.name} · ${r.total.toLocaleString()}명<br><small>${pop.day.slice(0,4)}.${pop.day.slice(4,6)} 기준 유동인구</small></div>`);
        label.setPosition(new kakao.maps.LatLng(r.lat, r.lng));
        label.setMap(map);
      });
      return c;
    });
    wireChip('chip-pop', on => {
      circles.forEach(c => c.setMap(on ? map : null));
      if (!on) label.setMap(null);
      gtag('event', 'layer_toggle', { layer: 'population', on });
    });
  } catch (e) {}

  return 'kakao';
}

// ── OSM(Leaflet) 폴백 ─────────────────────────────────────────
async function initLeaflet(data, cfg) {
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  const map = L.map('map', { zoomControl: false }).setView([CENTER.lat, CENTER.lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  map.on('click', () => sheet.classList.remove('open'));

  const incidentLayer = L.layerGroup().addTo(map);
  data.incidents.forEach(inc => {
    L.marker([inc.lat, inc.lng], { icon: L.divIcon({ html: '<span class="pin-dot"></span>', className: '', iconSize: [18, 18] }) })
      .addTo(incidentLayer).on('click', () => openSheet(inc));
  });
  document.getElementById('chip-incident').onclick = function () {
    this.classList.toggle('on') ? incidentLayer.addTo(map) : map.removeLayer(incidentLayer);
  };

  if (cfg.safemapKey) {
    const wms = L.tileLayer.wms(CRIME_WMS, {
      layers: 'A2SM_CRMNLHSPOT_TOT', styles: 'A2SM_CrmnlHspot_Tot_Tot',
      format: 'image/png', transparent: true, version: '1.1.1',
      serviceKey: cfg.safemapKey, opacity: .55, attribution: '범죄주의구간 © 경찰청·생활안전지도'
    });
    wireChip('chip-crime', on => {
      on ? wms.addTo(map) : map.removeLayer(wms);
      gtag('event', 'layer_toggle', { layer: 'crime_zone', on });
    });
  }

  try {
    const pop = await (await fetch('data/pop.json')).json();
    const { color } = popStyle(pop.regions);
    const layer = L.layerGroup();
    pop.regions.forEach(r => {
      L.circleMarker([r.lat, r.lng], {
        radius: 6 + Math.sqrt(r.total) / 18,
        color: color(r.total), weight: 1.5, fillColor: color(r.total), fillOpacity: .3
      }).addTo(layer).bindTooltip(
        `${r.name} · ${r.total.toLocaleString()}명<br><small>${pop.day.slice(0,4)}.${pop.day.slice(4,6)} 기준 유동인구</small>`
      );
    });
    wireChip('chip-pop', on => {
      on ? layer.addTo(map) : map.removeLayer(layer);
      gtag('event', 'layer_toggle', { layer: 'population', on });
    });
  } catch (e) {}

  return 'osm';
}

(async () => {
  const data = await (await fetch('data/incidents.json')).json();
  document.getElementById('stat-count').textContent = data.stats.unresolvedAdultMissing + '명';
  let cfg = {};
  try { const r = await fetch('config.json'); if (r.ok) cfg = await r.json(); } catch (e) {}
  let engine;
  try {
    engine = cfg.kakaoKey ? await initKakao(data, cfg) : await initLeaflet(data, cfg);
  } catch (e) {
    engine = await initLeaflet(data, cfg);
  }
  gtag('event', 'map_loaded', { incident_count: data.incidents.length, map_engine: engine });
})();
</script>
</body>
</html>
