<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 안전지도 - 실종 사건 지도</title>
<meta name="description" content="제주 실종 사건과 안전 정보를 지도에서 확인하세요. 언론 보도 기반, 출처 링크 포함.">
<meta property="og:title" content="제주 안전지도">
<meta property="og:description" content="제주에서 최근 어디서 실종 사건이 있었는지 지도로 확인하세요.">
<!-- GA4: 측정 ID 발급 후 G-XXXXXXXXXX 교체 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XXXXXXXXXX');
</script>
<style>
:root { --ink:#1c1c1e; --sub:#6e6e73; --accent:#c0392b; --card:#ffffff; }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:var(--ink); }
#map { position:fixed; inset:0; }
.banner {
  position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; z-index:1000;
  background:var(--card); border-radius:14px; padding:12px 16px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
}
.banner h1 { font-size:16px; }
.banner p { font-size:13px; color:var(--sub); margin-top:4px; line-height:1.45; }
.banner strong { color:var(--accent); }
.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:var(--card); border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.2);
  transform:translateY(110%); transition:transform .25s ease;
  max-height:60vh; overflow-y:auto;
}
.sheet.open { transform:translateY(0); }
.sheet .status { display:inline-block; font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; margin-bottom:8px; }
.sheet h2 { font-size:17px; margin-bottom:2px; }
.sheet .area { font-size:13px; color:var(--sub); margin-bottom:10px; }
.sheet .summary { font-size:14px; line-height:1.6; margin-bottom:12px; }
.sheet .src { font-size:13px; }
.sheet .src a { color:#0a66c2; text-decoration:none; margin-right:10px; }
.sheet .close { position:absolute; top:10px; right:14px; border:0; background:none; font-size:22px; color:var(--sub); cursor:pointer; }
.foot {
  position:fixed; bottom:calc(8px + env(safe-area-inset-bottom)); left:12px; right:12px; z-index:900;
  font-size:11px; color:var(--sub); background:rgba(255,255,255,.88); border-radius:10px; padding:8px 12px; line-height:1.5;
}
.pin-dot { display:block; width:18px; height:18px; background:var(--accent); border:2px solid #fff; border-radius:50%; box-shadow:0 1px 6px rgba(0,0,0,.4); }
.chips { display:flex; gap:8px; margin-top:10px; }
.chip { font-size:13px; border:1px solid #d1d1d6; background:#fff; color:var(--sub); border-radius:999px; padding:5px 12px; cursor:pointer; }
.chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.chip[hidden] { display:none; }
</style>
</head>
<body>
<div id="map"></div>

<header class="banner">
  <h1>제주 안전지도</h1>
  <p>최근 3년 7개월간 제주 성인 실종 미해결 <strong id="stat-count">15명</strong> (제주경찰청 전수조사).
  아래 핀은 언론 보도로 확인된 사건입니다.</p>
  <div class="chips">
    <button class="chip on" id="chip-incident">실종 사건</button>
    <button class="chip" id="chip-cctv" hidden>방범 CCTV</button>
    <button class="chip" id="chip-crime" hidden>범죄주의구간</button>
    <button class="chip" id="chip-pop" hidden>유동인구</button>
  </div>
</header>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="close" id="sheet-close" aria-label="닫기">&times;</button>
  <span class="status" id="s-status"></span>
  <h2 id="s-title"></h2>
  <div class="area" id="s-area"></div>
  <div class="summary" id="s-summary"></div>
  <div class="src" id="s-sources"></div>
</section>

<footer class="foot">
  사건 위치는 피해자 보호를 위해 읍면 중심 수준으로 표시했습니다. 정확한 지점이 아닙니다.
  모든 정보는 언론 보도를 출처와 함께 정리한 것입니다.
</footer>

<script>
// 네이버 지도 NCP 키. 콘솔에서 발급 후 교체하고, Web 서비스 URL에 https://jeju.kimyukah.com 등록 필요.
// 키가 없거나 로드에 실패하면 OSM(Leaflet)으로 자동 폴백한다.
const NAVER_KEY = 'NAVER_NCP_KEY_HERE';

const CENTER = { lat: 33.38, lng: 126.53 };
const sheet = document.getElementById('sheet');
document.getElementById('sheet-close').onclick = () => sheet.classList.remove('open');

function openSheet(inc) {
  document.getElementById('s-status').textContent = inc.status;
  document.getElementById('s-title').textContent = inc.title;
  document.getElementById('s-area').textContent = inc.area + ' · ' + inc.date;
  document.getElementById('s-summary').textContent = inc.summary;
  document.getElementById('s-sources').innerHTML =
    '출처: ' + inc.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join('');
  sheet.classList.add('open');
  gtag('event', 'incident_open', { incident_id: inc.id });
}

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

async function initNaver(data) {
  await loadScript(`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_KEY}`);
  if (!window.naver || !naver.maps) throw new Error('naver maps unavailable');
  const map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(CENTER.lat, CENTER.lng),
    zoom: 10,
    scaleControl: false, logoControlOptions: { position: naver.maps.Position.BOTTOM_LEFT }
  });
  naver.maps.Event.addListener(map, 'click', () => sheet.classList.remove('open'));
  data.incidents.forEach(inc => {
    const m = new naver.maps.Marker({
      position: new naver.maps.LatLng(inc.lat, inc.lng),
      map,
      icon: { content: '<span class="pin-dot"></span>', anchor: new naver.maps.Point(9, 9) }
    });
    naver.maps.Event.addListener(m, 'click', () => openSheet(inc));
  });
  return 'naver';
}

async function initLeaflet(data) {
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  const map = L.map('map', { zoomControl: false }).setView([CENTER.lat, CENTER.lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  map.on('click', () => sheet.classList.remove('open'));
  const incidentLayer = L.layerGroup().addTo(map);
  data.incidents.forEach(inc => {
    L.marker([inc.lat, inc.lng], { icon: L.divIcon({ html: '<span class="pin-dot"></span>', className: '', iconSize: [18, 18] }) })
      .addTo(incidentLayer).on('click', () => openSheet(inc));
  });
  document.getElementById('chip-incident').onclick = function () {
    this.classList.toggle('on');
    this.classList.contains('on') ? incidentLayer.addTo(map) : map.removeLayer(incidentLayer);
  };
  initCctv(map).catch(() => {});
  initCrimeWms(map).catch(() => {});
  initPop(map).catch(() => {});
  return 'osm';
}

// 읍면동별 유동인구(통신사 빅데이터, 제주 인구정책 통합플랫폼). 붐비는 곳과 한적한 곳을
// 한눈에 구분하는 용도다. 상위 1/3은 청록(사람 많음), 하위 1/3은 주황(인적 드묾).
// 판정이 아니라 사실(사람 수) 표시라서 지역 낙인 리스크가 낮다.
async function initPop(map) {
  const res = await fetch('data/pop.json');
  if (!res.ok) return;
  const pop = await res.json();
  const totals = pop.regions.map(r => r.total).sort((a, b) => a - b);
  const q = p => totals[Math.floor(totals.length * p)];
  const [lo, hi] = [q(1 / 3), q(2 / 3)];
  const color = t => t >= hi ? '#0e7c7b' : t >= lo ? '#8e8e93' : '#e07b00';
  const layer = L.layerGroup();
  pop.regions.forEach(r => {
    L.circleMarker([r.lat, r.lng], {
      radius: 6 + Math.sqrt(r.total) / 18,
      color: color(r.total), weight: 1.5, fillColor: color(r.total), fillOpacity: .3
    }).addTo(layer).bindTooltip(
      `${r.name} · ${r.total.toLocaleString()}명<br><small>${pop.day.slice(0,4)}.${pop.day.slice(4,6)} 기준 유동인구</small>`
    );
  });
  const chip = document.getElementById('chip-pop');
  chip.hidden = false;
  chip.onclick = function () {
    const on = this.classList.toggle('on');
    on ? layer.addTo(map) : map.removeLayer(layer);
    gtag('event', 'layer_toggle', { layer: 'population', on });
  };
}

// 경찰청 범죄주의구간(5대 범죄 밀도, 생활안전지도 WMS). 우리가 위험도를 판정하지 않고
// 국가 데이터를 그대로 오버레이만 한다. 키는 공개 repo에 커밋하지 않으려고
// 서버에만 두는 config.json에서 읽는다. 없으면 칩을 숨긴 채 둔다.
async function initCrimeWms(map) {
  const res = await fetch('config.json');
  if (!res.ok) return;
  const cfg = await res.json();
  if (!cfg.safemapKey) return;
  const wms = L.tileLayer.wms('https://www.safemap.go.kr/openapi2/IF_0087_WMS', {
    layers: 'A2SM_CRMNLHSPOT_TOT', styles: 'A2SM_CrmnlHspot_Tot_Tot',
    format: 'image/png', transparent: true, version: '1.1.1',
    serviceKey: cfg.safemapKey,
    opacity: .55, attribution: '범죄주의구간 © 경찰청·생활안전지도'
  });
  const chip = document.getElementById('chip-crime');
  chip.hidden = false;
  chip.onclick = function () {
    const on = this.classList.toggle('on');
    on ? wms.addTo(map) : map.removeLayer(wms);
    gtag('event', 'layer_toggle', { layer: 'crime_zone', on });
  };
}

// 방범 CCTV 히트맵. data/cctv.json이 아직 없으면(인증키 미발급) 칩 자체를 숨긴 채 둔다.
async function initCctv(map) {
  const res = await fetch('data/cctv.json');
  if (!res.ok) return;
  const cctv = await res.json();
  await loadScript('https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js');
  const heat = L.heatLayer(cctv.points.map(p => [p[0], p[1], Math.min(p[2], 4)]), {
    radius: 14, blur: 18, minOpacity: .25,
    gradient: { .3: '#7fb2f0', .6: '#2f7de1', 1: '#0a4fa8' }  // 파랑 계열: 위험(빨강)과 구분되는 "안심" 색
  });
  // 확대하면 개별 지점도 보여준다. 히트맵만으로는 "우리 골목에 있나"를 답할 수 없다.
  const dots = L.layerGroup();
  cctv.points.forEach(p => dots.addLayer(
    L.circleMarker([p[0], p[1]], { radius: 4, color: '#0a4fa8', weight: 1, fillOpacity: .8 })));
  let on = false;
  const sync = () => {
    if (!on) return;
    map.getZoom() >= 15 ? (map.hasLayer(dots) || dots.addTo(map)) : map.removeLayer(dots);
  };
  map.on('zoomend', sync);
  const chip = document.getElementById('chip-cctv');
  chip.hidden = false;
  chip.onclick = function () {
    on = this.classList.toggle('on');
    if (on) { heat.addTo(map); sync(); } else { map.removeLayer(heat); map.removeLayer(dots); }
    gtag('event', 'layer_toggle', { layer: 'cctv', on });
  };
}

fetch('data/incidents.json')
  .then(r => r.json())
  .then(async data => {
    document.getElementById('stat-count').textContent = data.stats.unresolvedAdultMissing + '명';
    let engine;
    try {
      engine = NAVER_KEY.startsWith('NAVER_') ? await initLeaflet(data) : await initNaver(data);
    } catch (e) {
      engine = await initLeaflet(data);
    }
    gtag('event', 'map_loaded', { incident_count: data.incidents.length, map_engine: engine });
  });
</script>
</body>
</html>
