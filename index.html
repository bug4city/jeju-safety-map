<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root {
  /* 미니 디자인 토큰 — 색은 여기서만 정의한다 */
  --ink:#1c1c1e; --sub:#6e6e73; --card:#ffffff; --line:#ececf0;
  --accent:#c0392b;            /* 사건(빨강) — 데이터 의미 전용 */
  --brand:#00a05a;             /* 안전=초록. 인터랙션·선택·링크 전용, 데이터 색과 안 겹침 */
  --brand-soft:#e6f6ee;
  --line-strong:#d1d1d6;
  --r-sm:10px; --r-lg:16px;
  --shadow-1:0 1px 6px rgba(0,0,0,.1);
  --shadow-2:0 4px 20px rgba(0,0,0,.14);
  --fs-title:17px; --fs-body:14px; --fs-ui:13.5px; --fs-sub:12.5px; --fs-cap:11px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;  /* 간격은 이 4단계만 쓴다 */
  --panel-w:360px; --sheet-peek:112px; --sheet-half:46vh;
}
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:var(--ink); overflow:hidden; }
#map { position:fixed; inset:0; }

/* ── 패널: 모바일은 바텀시트, 데스크톱은 좌측 고정 ── */
.panel {
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:var(--card); border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.14);
  height:85vh; transform:translateY(calc(100% - var(--sheet-peek)));
  transition:transform .28s cubic-bezier(.3,.9,.3,1);
  display:flex; flex-direction:column;
}
.panel.half { transform:translateY(calc(100% - var(--sheet-half))); }
.panel.full { transform:translateY(calc(8px + env(safe-area-inset-top))); }
.grab { padding:10px 0 4px; cursor:grab; flex:none; }
.grab::before { content:''; display:block; width:44px; height:5px; border-radius:3px; background:var(--line-strong); margin:0 auto; }
.panel-head { padding:2px var(--sp-4) var(--sp-2); flex:none; }
.panel-head h1 { font-size:var(--fs-title); }
.panel-head p { font-size:var(--fs-sub); color:var(--sub); margin-top:var(--sp-1); line-height:1.5; }
.panel-head strong { color:var(--accent); }
.tabs { display:flex; gap:var(--sp-2); padding:0 var(--sp-4) var(--sp-2); flex:none; }
.tab { flex:1; font-size:var(--fs-ui); padding:8px 0; border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:var(--r-sm); cursor:pointer; }
.tab.on { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600; }
.panel-body { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:0 var(--sp-4) calc(20px + env(safe-area-inset-bottom)); }

.item { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-2) 0; border-bottom:1px solid var(--line); cursor:pointer; }
.item .dot { flex:none; width:12px; height:12px; border-radius:50%; }
.item .t { flex:1; min-width:0; }
.item .t b { display:block; font-size:var(--fs-body); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .t span { font-size:var(--fs-sub); color:var(--sub); }
.item .badge { flex:none; font-size:11.5px; font-weight:700; border-radius:6px; padding:3px 7px; color:#fff; }
.bar-wrap { flex:none; width:74px; }
.bar-wrap small { display:block; font-size:var(--fs-cap); color:var(--sub); text-align:right; margin-bottom:3px; }
.bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; }

/* 상세 뷰 */
.detail { display:none; padding:var(--sp-1) 0 20px; }
.detail.on { display:block; }
.list-view.off { display:none; }
.back { border:0; background:none; color:var(--brand); font-size:var(--fs-body); padding:6px 0 10px; cursor:pointer; }
.detail .status { display:inline-block; font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; margin-bottom:8px; }
.detail h2 { font-size:var(--fs-title); margin-bottom:2px; }
.detail .area { font-size:13px; color:var(--sub); margin-bottom:var(--sp-2); }
.detail .summary { font-size:var(--fs-body); line-height:1.65; margin-bottom:var(--sp-3); }
.detail .src { font-size:13px; }
.detail .src a { color:var(--brand); text-decoration:none; margin-right:10px; }

/* 지도 위 요소 */
.chips { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; z-index:1000; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
.chip { flex:none; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:999px; padding:7px 13px; cursor:pointer; box-shadow:var(--shadow-1); }
.chip.on { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
.chip[hidden] { display:none; }
.legend {
  position:fixed; right:10px; bottom:calc(var(--sheet-peek) + 12px); z-index:900;
  background:rgba(255,255,255,.93); border-radius:var(--r-sm); padding:7px 11px; font-size:11.5px;
  box-shadow:var(--shadow-1); line-height:1.7;
}
.legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
.legend[hidden] { display:none; }

.pin-dot { display:block; width:18px; height:18px; background:var(--accent); border:2px solid #fff; border-radius:50%; box-shadow:0 1px 6px rgba(0,0,0,.4); cursor:pointer; }
.pop-num {
  background:#fff; border:2px solid; border-radius:999px; padding:3px 9px;
  font-size:12px; font-weight:700; box-shadow:var(--shadow-1); cursor:pointer; white-space:nowrap;
}
.pop-num small { font-weight:500; }
.cluster-num {
  width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
  border:3px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:pointer;
}
.foot-note { position:fixed; left:10px; bottom:calc(var(--sheet-peek) + 12px); z-index:890; max-width:46vw;
  font-size:10.5px; color:var(--sub); background:rgba(255,255,255,.88); border-radius:8px; padding:6px 9px; line-height:1.45; box-shadow:var(--shadow-1); }

/* 안전 점검 카드 */
.check-btn {
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--sheet-peek) + 12px); z-index:950;
  background:var(--brand); color:#fff; border:0; border-radius:999px; padding:12px 20px;
  font-size:var(--fs-body); font-weight:600; box-shadow:var(--shadow-2); cursor:pointer;
}
.check-btn[hidden] { display:none; }
.card-input { display:flex; gap:8px; margin:10px 0 14px; }
.card-input input { flex:1; min-width:0; font-size:15px; border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:10px 12px; }
.card-input input:focus { outline:none; border-color:var(--brand); }
.card-input button { font-size:var(--fs-body); border:0; border-radius:var(--r-sm); padding:10px 14px; background:var(--brand); color:#fff; cursor:pointer; }
.safety-card { border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; background:#fff; }
.safety-card h3 { font-size:15.5px; margin-bottom:2px; }
.safety-card .addr { font-size:var(--fs-cap); color:var(--sub); margin-bottom:10px; }
.safety-card .row { display:flex; justify-content:space-between; gap:12px; font-size:var(--fs-ui); padding:7px 0; border-top:1px solid var(--line); }
.safety-card .row:first-of-type { border-top:0; }
.safety-card .row b { text-align:right; white-space:nowrap; }
.safety-card .tagchip { display:inline-block; font-size:11.5px; font-weight:700; color:#fff; border-radius:6px; padding:2px 7px; }
.safety-card .brand { margin-top:10px; font-size:var(--fs-cap); color:var(--sub); }
.card-actions { display:flex; gap:8px; margin-top:12px; }
.card-actions button { flex:1; font-size:var(--fs-ui); border:1px solid var(--line-strong); background:#fff; border-radius:var(--r-sm); padding:10px 0; cursor:pointer; }
.card-actions .kakao { background:#FEE500; border-color:#FEE500; font-weight:600; }
.card-hint { font-size:var(--fs-sub); color:var(--sub); margin-top:8px; line-height:1.5; }

/* ── 데스크톱: 좌측 패널 ── */
@media (min-width: 900px) {
  .panel { left:0; right:auto; top:0; bottom:0; width:var(--panel-w); height:100%;
    border-radius:0; transform:none !important; box-shadow:var(--shadow-2); }
  .grab { display:none; }
  .chips { left:calc(var(--panel-w) + 14px); }
  .legend { bottom:18px; }
  .foot-note { left:calc(var(--panel-w) + 14px); bottom:18px; max-width:360px; }
}
</style>
</head>
<body>
<div id="map"></div>

<div class="chips">
  <button class="chip on" id="chip-incident">실종 사건</button>
  <button class="chip on" id="chip-pop" hidden>유동인구</button>
  <button class="chip" id="chip-crime" hidden>범죄주의구간</button>
  <button class="chip" id="chip-cctv" hidden>방범 CCTV</button>
</div>

<aside class="panel" id="panel">
  <div class="grab" id="grab"></div>
  <div class="panel-head">
    <h1>제주 안전지도</h1>
    <p>최근 3년 7개월간 제주 성인 실종 미해결 <strong id="stat-count">15명</strong> (제주경찰청 전수조사).
    핀은 언론 보도로 확인된 사건입니다.</p>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="incident">실종 사건</button>
    <button class="tab" data-tab="region">한적한 지역</button>
  </div>
  <div class="panel-body">
    <div class="list-view" id="list-view"></div>
    <div class="detail" id="detail"></div>
  </div>
</aside>

<div class="legend" id="legend" hidden>
  <b style="font-size:11px">지역 붐빔도 <small style="font-weight:400;color:var(--sub)">통신사 유동인구</small></b>
  <div style="display:flex;align-items:center;gap:5px;margin:5px 0 2px">
    <span style="font-size:10.5px">한적</span>
    <span style="flex:1;height:8px;border-radius:4px;background:linear-gradient(to right,#d35400,#f0a35e,#d9d4c5,#7fa8d9,#2a5ca8);min-width:84px"></span>
    <span style="font-size:10.5px">붐빔</span>
  </div>
  <div><i style="background:var(--accent);border:2px solid #fff"></i>실종 사건 (핀)</div>
</div>

<button class="check-btn" id="check-btn" hidden>🔍 내 숙소 안전 점검</button>

<div class="foot-note">사건 위치는 피해자 보호를 위해 읍면 중심 수준으로 표시. 언론 보도·공공데이터 기반, 출처 표기.</div>

<script>
const CENTER = { lat: 33.38, lng: 126.53 };
const CRIME_WMS = 'https://www.safemap.go.kr/openapi2/IF_0087_WMS';
const state = { data: null, pop: null, tab: 'incident', focus: null };

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
function haversineKm(a, b) {
  const R = 6371, d = Math.PI / 180;
  const x = Math.sin((b.lat - a.lat) * d / 2) ** 2 +
    Math.cos(a.lat * d) * Math.cos(b.lat * d) * Math.sin((b.lng - a.lng) * d / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmt(n) { return n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '만' : n.toLocaleString(); }
function popStyle(regions) {
  const totals = regions.map(r => r.total).sort((a, b) => a - b);
  const q = p => totals[Math.min(totals.length - 1, Math.floor(totals.length * p))];
  const cuts = [q(.2), q(.4), q(.6), q(.8)];
  // 5단계: 진한 주황(가장 한적) → 진한 파랑(가장 붐빔). 색약에도 안전한 조합.
  // 초록 계열은 브랜드 전용이므로 데이터 색에서 뺀다. 범례 그라데이션과 함께 갱신할 것.
  const COLORS = ['#d35400', '#f0a35e', '#d9d4c5', '#7fa8d9', '#2a5ca8'];
  const tier = t => cuts.findIndex(c => t < c) === -1 ? 4 : cuts.findIndex(c => t < c);
  return { color: t => COLORS[tier(t)],
           tag: t => ['가장 한적', '한적', '보통', '붐빔', '가장 붐빔'][tier(t)] };
}

// ── 패널(목록/상세) : 거지맵 패턴 — 목록 항목 ↔ 지도 이동 연동, 상세는 같은 패널에서 전환 ──
const panel = document.getElementById('panel');
const listView = document.getElementById('list-view');
const detailView = document.getElementById('detail');
document.getElementById('grab').onclick = () => {
  panel.classList.toggle('half', !panel.classList.contains('half') && !panel.classList.contains('full'));
  if (!panel.classList.contains('half')) panel.classList.remove('full');
};
let mapApi = { panTo: () => {} };

function showDetail(html) {
  detailView.innerHTML = '<button class="back" id="back-btn">&larr; 목록으로</button>' + html;
  detailView.classList.add('on'); listView.classList.add('off');
  document.getElementById('back-btn').onclick = () => {
    detailView.classList.remove('on'); listView.classList.remove('off');
  };
  if (window.matchMedia('(max-width: 899px)').matches) panel.classList.add('half');
}
function incidentDetail(inc) {
  showDetail(`
    <span class="status">${inc.status}</span>
    <h2>${inc.title}</h2>
    <div class="area">${inc.area} · ${inc.date}</div>
    <div class="summary">${inc.summary}</div>
    <div class="src">출처: ${inc.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join('')}</div>`);
  gtag('event', 'incident_open', { incident_id: inc.id });
}
function regionDetail(r, style, rank, n) {
  const near = state.data.incidents
    .map(i => ({ i, km: haversineKm(r, i) })).filter(x => x.km <= 8)
    .sort((a, b) => a.km - b.km);
  showDetail(`
    <span class="status" style="background:${style.color(r.total)}">${style.tag(r.total)}</span>
    <h2>${r.name}</h2>
    <div class="area">43개 지역 중 한적한 순 ${rank}위</div>
    <div class="summary">하루 동안 이 지역을 오간 사람이 약 <b>${r.total.toLocaleString()}명</b>입니다
    (${state.pop.day.slice(0,4)}년 ${+state.pop.day.slice(4,6)}월 ${+state.pop.day.slice(6,8)}일, 통신사 빅데이터 기준).<br>
    ${near.length ? `반경 8km 내 보도 확인 사건 ${near.length}건 (가장 가까운 곳 ${near[0].km.toFixed(1)}km)` : '반경 8km 내 보도 확인 사건 없음'}</div>`);
  gtag('event', 'region_open', { region: r.name });
}

function renderList() {
  const el = listView; el.innerHTML = '';
  if (state.tab === 'incident') {
    state.data.incidents.forEach(inc => {
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = `<span class="dot" style="background:var(--accent)"></span>
        <div class="t"><b>${inc.title}</b><span>${inc.area} · ${inc.date}</span></div>
        <span class="badge" style="background:var(--accent)">${inc.status}</span>`;
      d.onclick = () => { mapApi.panTo(inc.lat, inc.lng, 7); incidentDetail(inc); };
      el.appendChild(d);
    });
  } else if (state.pop) {
    const style = popStyle(state.pop.regions);
    const sorted = [...state.pop.regions].sort((a, b) => a.total - b.total);
    const max = sorted[sorted.length - 1].total;
    sorted.forEach((r, idx) => {
      const c = style.color(r.total);
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = `<span class="dot" style="background:${c}"></span>
        <div class="t"><b>${r.name}</b><span>${style.tag(r.total)}</span></div>
        <div class="bar-wrap"><small>${fmt(r.total)}명</small><div class="bar"><i style="width:${Math.max(4, r.total / max * 100)}%;background:${c}"></i></div></div>`;
      d.onclick = () => { mapApi.panTo(r.lat, r.lng, 7); regionDetail(r, style, idx + 1, sorted.length); };
      el.appendChild(d);
    });
  }
  detailView.classList.remove('on'); listView.classList.remove('off');
}
document.getElementById('tabs').onclick = e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  state.tab = t.dataset.tab; renderList();
  gtag('event', 'tab_switch', { tab: state.tab });
};

function wireChip(id, onToggle, defaultOn) {
  const chip = document.getElementById(id);
  chip.hidden = false;
  chip.onclick = function () { onToggle(this.classList.toggle('on')); };
  if (defaultOn) { chip.classList.add('on'); onToggle(true); }
  return chip;
}


// ── 안전 점검 카드: 주소 검색 → 요약 카드 → 저장/공유 (카카오맵 엔진 전용) ──
function setupCard(map, cfg) {
  if (!state.pop) return;
  const btn = document.getElementById('check-btn');
  btn.hidden = false;
  const geocoder = new kakao.maps.services.Geocoder();
  const places = new kakao.maps.services.Places();
  const style = popStyle(state.pop.regions);
  const sorted = [...state.pop.regions].sort((a, b) => a.total - b.total);
  let marker = null;

  const search = q => new Promise(resolve => {
    geocoder.addressSearch(q, (res, st) => {
      if (st === kakao.maps.services.Status.OK && res[0])
        return resolve({ name: q, addr: res[0].address_name, lat: +res[0].y, lng: +res[0].x });
      places.keywordSearch(q + ' 제주', (res2, st2) => {
        if (st2 === kakao.maps.services.Status.OK && res2[0])
          return resolve({ name: res2[0].place_name, addr: res2[0].address_name, lat: +res2[0].y, lng: +res2[0].x });
        resolve(null);
      });
    });
  });

  function renderCard(loc) {
    const region = state.pop.regions.reduce((a, r) => haversineKm(loc, r) < haversineKm(loc, a) ? r : a);
    const rank = sorted.findIndex(x => x.name === region.name) + 1;
    const near = state.data.incidents.map(i => ({ i, km: haversineKm(loc, i) }))
      .filter(x => x.km <= 8).sort((a, b) => a.km - b.km);
    const c = style.color(region.total), tag = style.tag(region.total);
    const summaryText = `${loc.name} 주변: 반경 8km 사건 ${near.length}건, ${region.name} 붐빔도 "${tag}"(43곳 중 한적 ${rank}위)`;
    document.getElementById('card-result').innerHTML = `
      <div class="safety-card" id="the-card">
        <h3>${loc.name}</h3>
        <div class="addr">${loc.addr}</div>
        <div class="row"><span>반경 8km 내 보도 확인 사건</span><b style="color:${near.length ? 'var(--accent)' : 'inherit'}">${near.length ? near.length + '건 (최근접 ' + near[0].km.toFixed(1) + 'km)' : '없음'}</b></div>
              <div class="row"><span>지역 붐빔도 (${region.name})</span><b><span class="tagchip" style="background:${c}">${tag}</span></b></div>
        <div class="row"><span>하루 유동인구</span><b>약 ${region.total.toLocaleString()}명</b></div>
        <div class="row"><span>한적한 순위</span><b>43곳 중 ${rank}위</b></div>
        <div class="brand">제주 안전지도 · jeju.kimyukah.com · ${state.pop.day.slice(0,4)}.${state.pop.day.slice(4,6)} 통신사 데이터 + 언론 보도 기준</div>
      </div>
      <div class="card-actions">
        <button id="card-save">이미지 저장</button>
        <button id="card-kakao" class="kakao">카톡 공유</button>
        <button id="card-copy">링크 복사</button>
      </div>
      <div class="card-hint">한적함은 위험 판정이 아니라 통신사 유동인구 사실 데이터입니다. 사건 위치는 읍면 중심 수준으로 뭉개져 있어 거리는 근사치입니다.</div>`;
    gtag('event', 'card_create', { region: region.name, incidents_8km: near.length });

    if (marker) marker.setMap(null);
    marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(loc.lat, loc.lng), map });
    map.setLevel(6); map.panTo(new kakao.maps.LatLng(loc.lat, loc.lng));

    document.getElementById('card-save').onclick = async () => {
      if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      const canvas = await html2canvas(document.getElementById('the-card'), { scale: 2, backgroundColor: '#fff' });
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png'); a.download = '제주안전지도_점검카드.png'; a.click();
      gtag('event', 'card_share', { method: 'image' });
    };
    document.getElementById('card-kakao').onclick = async () => {
      if (!window.Kakao) await loadScript('https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js');
      if (!Kakao.isInitialized()) Kakao.init(cfg.kakaoKey);
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: '\uD83D\uDD0D 내 숙소 안전 점검 결과\n' + summaryText,
        link: { mobileWebUrl: 'https://jeju.kimyukah.com', webUrl: 'https://jeju.kimyukah.com' },
        buttonTitle: '내 숙소도 점검하기'
      });
      gtag('event', 'card_share', { method: 'kakao' });
    };
    document.getElementById('card-copy').onclick = async () => {
      await navigator.clipboard.writeText('https://jeju.kimyukah.com \n' + summaryText);
      document.getElementById('card-copy').textContent = '복사됨!';
      gtag('event', 'card_share', { method: 'copy' });
    };
  }

  btn.onclick = () => {
    showDetail(`
      <h2>내 숙소 안전 점검</h2>
      <div class="card-input">
        <input id="addr-input" type="text" placeholder="숙소 주소나 이름 (예: 제주시 애월읍 ...)" enterkeyhint="search">
        <button id="addr-go">확인</button>
      </div>
      <div id="card-result" class="card-hint">주소나 게스트하우스·호텔 이름을 입력하면 주변 사건과 지역 붐빔도를 요약해드립니다.</div>`);
    const input = document.getElementById('addr-input');
    const go = async () => {
      const q = input.value.trim(); if (!q) return;
      document.getElementById('card-result').textContent = '검색 중...';
      const loc = await search(q);
      if (!loc) { document.getElementById('card-result').textContent = '위치를 찾지 못했습니다. 주소를 더 자세히 입력해보세요.'; return; }
      renderCard(loc);
    };
    document.getElementById('addr-go').onclick = go;
    input.onkeydown = e => { if (e.key === 'Enter') go(); };
    input.focus();
    gtag('event', 'card_open');
  };
}

// ── 카카오맵 엔진 ──
async function initKakao(cfg) {
  await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${cfg.kakaoKey}&autoload=false&libraries=clusterer,services`);
  await new Promise(ok => kakao.maps.load(ok));
  const map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(CENTER.lat, CENTER.lng), level: 10
  });
  mapApi.panTo = (lat, lng, level) => {
    if (level != null && map.getLevel() > level) map.setLevel(level);
    map.panTo(new kakao.maps.LatLng(lat, lng));
  };

  // 사건: 축소하면 숫자 클러스터, 확대하면 개별 핀 (거지맵 패턴)
  const clusterer = new kakao.maps.MarkerClusterer({
    map, averageCenter: true, minLevel: 9, gridSize: 80,
    styles: [{ width: '40px', height: '40px', background: 'rgba(192,57,43,.95)', color: '#fff',
      borderRadius: '50%', border: '3px solid #fff', textAlign: 'center', lineHeight: '35px',
      fontWeight: '700', fontSize: '15px', boxShadow: '0 2px 10px rgba(0,0,0,.35)' }]
  });
  const pinImg = new kakao.maps.MarkerImage(
    'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#c0392b" stroke="#fff" stroke-width="3"/></svg>'),
    new kakao.maps.Size(22, 22), { offset: new kakao.maps.Point(11, 11) });
  const markers = state.data.incidents.map(inc => {
    const m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(inc.lat, inc.lng), image: pinImg });
    kakao.maps.event.addListener(m, 'click', () => { incidentDetail(inc); mapApi.panTo(inc.lat, inc.lng); });
    return m;
  });
  clusterer.addMarkers(markers);
  document.getElementById('chip-incident').onclick = function () {
    this.classList.toggle('on') ? clusterer.addMarkers(markers) : clusterer.removeMarkers(markers);
  };

  // 유동인구: 읍면동 경계를 한적함으로 채색 + 숫자 라벨 (기본 켜짐)
  // 사건이 있는 지역은 빨간 테두리. "위험도 점수"가 아니라 사실(사람 수·사건 유무)만 칠한다.
  if (state.pop) {
    const style = popStyle(state.pop.regions);
    const sorted = [...state.pop.regions].sort((a, b) => a.total - b.total);
    const byName = Object.fromEntries(state.pop.regions.map(r => [r.name, r]));
    let polygons = [];
    try {
      const geo = await (await fetch('data/regions.geojson')).json();
      const toPaths = g => (g.type === 'Polygon' ? [g.coordinates] : g.coordinates)
        .map(poly => poly[0].map(([lng, lat]) => new kakao.maps.LatLng(lat, lng)));
      geo.features.forEach(f => {
        const r = byName[f.properties.name]; if (!r) return;
        const p = new kakao.maps.Polygon({
          path: toPaths(f.geometry),
          strokeWeight: 1, strokeColor: '#8e8e93', strokeOpacity: .5,
          fillColor: style.color(r.total), fillOpacity: .35
        });
        kakao.maps.event.addListener(p, 'click', () => {
          regionDetail(r, style, sorted.findIndex(x => x.name === r.name) + 1, sorted.length);
        });
        polygons.push(p);
      });
    } catch (e) {}
    let popOn = false;
    const overlays = state.pop.regions.map(r => {
      const el = document.createElement('div');
      el.className = 'pop-num'; el.style.borderColor = style.color(r.total); el.style.color = style.color(r.total);
      el.onclick = () => { regionDetail(r, style, sorted.findIndex(x => x.name === r.name) + 1, sorted.length); mapApi.panTo(r.lat, r.lng); };
      const ov = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(r.lat, r.lng), content: el, yAnchor: .5, zIndex: 20 });
      return { ov, el, r };
    });
    // 축소: 색만(라벨 숨김) / 중간: 지역명 / 확대: 지역명+맥락 있는 숫자.
    // 숫자만 단독으로 띄우면 무슨 수인지 알 수 없다는 피드백 반영.
    const relabel = () => {
      const lv = map.getLevel();
      overlays.forEach(({ ov, el, r }) => {
        if (lv >= 10) { ov.setMap(null); return; }
        if (popOn) ov.setMap(map);
        el.innerHTML = lv >= 8 ? r.name : `${r.name} <small>· 사람 ${fmt(r.total)}</small>`;
      });
    };
    kakao.maps.event.addListener(map, 'zoom_changed', relabel);
    wireChip('chip-pop', on => {
      popOn = on;
      polygons.forEach(p => p.setMap(on ? map : null));
      if (on) relabel(); else overlays.forEach(o => o.ov.setMap(null));
      document.getElementById('legend').hidden = !on;
      gtag('event', 'layer_toggle', { layer: 'population', on });
    }, true);
  }

  // 범죄주의구간 WMS: 화면 bbox 이미지를 CustomOverlay로 덮고 idle마다 갱신
  if (cfg.safemapKey) {
    const img = document.createElement('img');
    img.style.cssText = 'opacity:.72;pointer-events:none;';
    // 앵커를 뷰포트 모서리에 두면 카카오가 화면 밖 판정으로 오버레이를 컬링해서
    // DOM에 안 붙는다. 중앙 앵커(0.5)로 두고 이미지가 화면 전체를 덮게 한다.
    const overlay = new kakao.maps.CustomOverlay({ content: img, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5 });
    let on = false;
    const refresh = () => {
      if (!on) return;
      const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
      const proj = map.getProjection();
      const p1 = proj.containerPointFromCoords(new kakao.maps.LatLng(ne.getLat(), sw.getLng()));
      const p2 = proj.containerPointFromCoords(new kakao.maps.LatLng(sw.getLat(), ne.getLng()));
      img.width = Math.round(p2.x - p1.x); img.height = Math.round(p2.y - p1.y);
      img.src = `${CRIME_WMS}?serviceKey=${cfg.safemapKey}&request=GetMap&layers=A2SM_CRMNLHSPOT_TOT&styles=A2SM_CrmnlHspot_Tot_Tot&format=image/png&transparent=TRUE&version=1.1.1&srs=EPSG:4326&bbox=${sw.getLng()},${sw.getLat()},${ne.getLng()},${ne.getLat()}&width=${img.width}&height=${img.height}`;
      overlay.setPosition(map.getCenter());
      overlay.setMap(map);
    };
    kakao.maps.event.addListener(map, 'idle', refresh);
    wireChip('chip-crime', v => {
      on = v;
      if (on) {
        // 격자가 도로 단위라 도 전체 축척에선 거의 안 보인다. 켜면 시내 축척으로 데려간다.
        if (map.getLevel() >= 9) { map.setLevel(7); map.panTo(new kakao.maps.LatLng(33.505, 126.525)); }
        refresh();
      } else overlay.setMap(null);
      gtag('event', 'layer_toggle', { layer: 'crime_zone', on });
    });
  }
  setupCard(map, cfg);
  return 'kakao';
}

// ── OSM(Leaflet) 폴백: 클러스터 없이 기본 표시만 ──
async function initLeaflet(cfg) {
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  const map = L.map('map', { zoomControl: false }).setView([CENTER.lat, CENTER.lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  mapApi.panTo = (lat, lng, level) => map.setView([lat, lng], Math.max(map.getZoom(), 12));

  state.data.incidents.forEach(inc => {
    L.marker([inc.lat, inc.lng], { icon: L.divIcon({ html: '<span class="pin-dot"></span>', className: '', iconSize: [18, 18] }) })
      .addTo(map).on('click', () => incidentDetail(inc));
  });
  if (state.pop) {
    const style = popStyle(state.pop.regions);
    const sorted = [...state.pop.regions].sort((a, b) => a.total - b.total);
    const byName = Object.fromEntries(state.pop.regions.map(r => [r.name, r]));
    const layer = L.layerGroup();
    try {
      const geo = await (await fetch('data/regions.geojson')).json();
      L.geoJSON(geo, {
        style: f => {
          const r = byName[f.properties.name];
          return { color: '#8e8e93', weight: 1, opacity: .5,
                   fillColor: r ? style.color(r.total) : '#ccc', fillOpacity: .35 };
        },
        onEachFeature: (f, l) => l.on('click', () => {
          const r = byName[f.properties.name]; if (!r) return;
          regionDetail(r, style, sorted.findIndex(x => x.name === r.name) + 1, sorted.length);
        })
      }).addTo(layer);
    } catch (e) {}
    state.pop.regions.forEach(r => {
      L.circleMarker([r.lat, r.lng], {
        radius: 6 + Math.sqrt(r.total) / 18, color: style.color(r.total), weight: 1.5,
        fillColor: style.color(r.total), fillOpacity: .3
      }).addTo(layer).on('click', () => regionDetail(r, style, sorted.findIndex(x => x.name === r.name) + 1, sorted.length));
    });
    wireChip('chip-pop', on => {
      on ? layer.addTo(map) : map.removeLayer(layer);
      document.getElementById('legend').hidden = !on;
    }, true);
  }
  if (cfg.safemapKey) {
    const wms = L.tileLayer.wms(CRIME_WMS, {
      layers: 'A2SM_CRMNLHSPOT_TOT', styles: 'A2SM_CrmnlHspot_Tot_Tot',
      format: 'image/png', transparent: true, version: '1.1.1',
      serviceKey: cfg.safemapKey, opacity: .55
    });
    wireChip('chip-crime', on => { on ? wms.addTo(map) : map.removeLayer(wms); });
  }
  return 'osm';
}

(async () => {
  state.data = await (await fetch('data/incidents.json')).json();
  document.getElementById('stat-count').textContent = state.data.stats.unresolvedAdultMissing + '명';
  try { state.pop = await (await fetch('data/pop.json')).json(); } catch (e) {}
  renderList();
  let cfg = {};
  try { const r = await fetch('config.json'); if (r.ok) cfg = await r.json(); } catch (e) {}
  let engine;
  try {
    engine = cfg.kakaoKey ? await initKakao(cfg) : await initLeaflet(cfg);
  } catch (e) {
    engine = await initLeaflet(cfg);
  }
  gtag('event', 'map_loaded', { incident_count: state.data.incidents.length, map_engine: engine });
})();
